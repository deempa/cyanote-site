<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="cl-title cl-desc">
  <title id="cl-title">Three checks that passed, and the question each one actually answered</title>
  <desc id="cl-desc">The build said it succeeded, but it had linked against a cached proc-macro library built under different settings; only a build from cold would have caught it. Continuous integration said green, but both workflows fired only on version tags and neither ran a test. The release verification said the uploaded bytes matched, but it read them back from a storage API still serving the previous release while the worker in front of it served the new ones.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 21px; font-weight: 600; fill: #0a0a0b; }
    .said { font-size: 18px; font-weight: 600; fill: #0e7cc4; }
    .item { font-size: 17px; fill: #3d3f45; }
    .note { font-size: 16px; fill: #71757e; }
    .lbl  { font-size: 15px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="368" height="286" rx="12"/>
  <text class="h" x="56" y="70">The build</text>
  <text class="lbl" x="56" y="102">IT SAID</text>
  <text class="said" x="56" y="128">Compiled successfully</text>
  <line x1="56" y1="152" x2="360" y2="152" stroke="#e6e6e9" stroke-width="2"/>
  <text class="lbl" x="56" y="182">WHAT IT ANSWERED</text>
  <text class="item" x="56" y="210">&#8220;Does it link against the</text>
  <text class="item" x="56" y="234">macro library already cached?&#8221;</text>
  <text class="note" x="56" y="272">Built under the old settings,</text>
  <text class="note" x="56" y="294">months before the flag went in.</text>

  <rect class="card" x="416" y="30" width="368" height="286" rx="12"/>
  <text class="h" x="448" y="70">Continuous integration</text>
  <text class="lbl" x="448" y="102">IT SAID</text>
  <text class="said" x="448" y="128">All checks passed</text>
  <line x1="448" y1="152" x2="752" y2="152" stroke="#e6e6e9" stroke-width="2"/>
  <text class="lbl" x="448" y="182">WHAT IT ANSWERED</text>
  <text class="item" x="448" y="210">&#8220;Did the two tag-only jobs</text>
  <text class="item" x="448" y="234">run, having run no tests?&#8221;</text>
  <text class="note" x="448" y="272">A commit could reach main</text>
  <text class="note" x="448" y="294">checked by nothing at all.</text>

  <rect class="card" x="808" y="30" width="368" height="286" rx="12"/>
  <text class="h" x="840" y="70">The release check</text>
  <text class="lbl" x="840" y="102">IT SAID</text>
  <text class="said" x="840" y="128">Signature mismatch</text>
  <line x1="840" y1="152" x2="1144" y2="152" stroke="#e6e6e9" stroke-width="2"/>
  <text class="lbl" x="840" y="182">WHAT IT ANSWERED</text>
  <text class="item" x="840" y="210">&#8220;What does the storage API</text>
  <text class="item" x="840" y="234">still have cached?&#8221;</text>
  <text class="note" x="840" y="272">Aborting a good release, in the</text>
  <text class="note" x="840" y="294">half-written state it guards.</text>

  <line x1="24" y1="356" x2="1176" y2="356" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="394">The question to ask of anything you rely on:</text>
  <text class="foot" x="24" y="426" font-weight="600" fill="#0a0a0b">what would have to be true for this to pass while the thing it protects is broken?</text>
  <text class="foot" x="24" y="456">Every one of these three had an obvious answer. None of them had ever been asked.</text>
</svg>
