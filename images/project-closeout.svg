<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="pc-title pc-desc">
  <title id="pc-title">What to keep and what to bin when a project ends</title>
  <desc id="pc-desc">Keep one summary note at the top of the folder covering what the project was, what happened, the decisions that shaped it, what you would do differently and where everything lives; keep the real numbers and the notes on who was who. Bin the scheduling messages, superseded drafts, done notes-to-self, undecodable fragments and duplicate copies of documents that live properly elsewhere.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 21px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 18px; fill: #3d3f45; }
    .gone { font-size: 18px; fill: #a3a7af; }
    .note { font-size: 16px; fill: #71757e; }
    .lbl  { font-size: 15px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="560" height="322" rx="12"/>
  <rect x="24" y="30" width="560" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl" x="56" y="72">KEEP</text>
  <text class="h" x="56" y="106">Things you cannot reconstruct</text>
  <line x1="56" y1="130" x2="552" y2="130" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="56" y="166">One summary note, at the top</text>
  <text class="item" x="56" y="200">The decisions, and why</text>
  <text class="item" x="56" y="234">The real numbers &#8212; time, cost, rounds</text>
  <text class="item" x="56" y="268">Where everything lives</text>
  <text class="item" x="56" y="302">Who was who, and how it went</text>
  <text class="note" x="56" y="336">Written now, while it is still honest.</text>

  <rect class="card" x="616" y="30" width="560" height="322" rx="12"/>
  <rect x="616" y="30" width="560" height="7" rx="3.5" fill="#b8bcc4"/>
  <text class="lbl" x="648" y="72">BIN</text>
  <text class="h" x="648" y="106">Scaffolding</text>
  <line x1="648" y1="130" x2="1144" y2="130" stroke="#e6e6e9" stroke-width="2"/>
  <text class="gone" x="648" y="166">&#8220;Can we move Thursday&#8221;</text>
  <text class="gone" x="648" y="200">Superseded drafts</text>
  <text class="gone" x="648" y="234">Notes-to-self, long since done</text>
  <text class="gone" x="648" y="268">Fragments you can no longer decode</text>
  <text class="gone" x="648" y="302">Duplicates of documents held elsewhere</text>
  <text class="note" x="648" y="336">A folder of six things gets opened. Sixty does not.</text>

  <line x1="24" y1="392" x2="1176" y2="392" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="430">Put the year and the client in the title, because search is how you will find this &#8212; and the</text>
  <text class="foot" x="24" y="458">stranger doing the searching is you, with everything about it forgotten.</text>
</svg>
