<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="nc-title nc-desc">
  <title id="nc-title">Where copies of a Notion page live</title>
  <desc id="nc-desc">A Notion page can live in at least five places. Notion's servers, encrypted with AES-256 with Notion holding the keys by default. Notion's backups, taken at least daily. An AI provider, for up to 30 days, if Notion AI drew on the page and the workspace is not on Enterprise. A device where it is available offline, chosen by you or downloaded automatically on paid plans, managed by the desktop or mobile app. And any export you made, which is a plain file you own.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .box  { fill: #f6f7f9; }
    .boxk { fill: #eaf4fb; }
    .h    { font-size: 26px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .t    { font-size: 20px; font-weight: 600; fill: #0a0a0b; }
    .k    { font-size: 16px; font-weight: 600; }
    .kn   { fill: #b4441f; }
    .ky   { fill: #0e7cc4; }
    .d    { font-size: 15px; fill: #71757e; }
    .ln   { stroke: #c9ccd2; stroke-width: 2; fill: none; }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="430" rx="12"/>
  <text class="h" x="56" y="66">Five places a Notion page can live</text>
  <text class="note" x="56" y="94">Who holds the key to each one. From Notion's help centre, checked 15 October 2026.</text>

  <!-- centre page -->
  <rect class="boxk" x="510" y="128" width="180" height="64" rx="10"/>
  <text class="t" x="600" y="168" text-anchor="middle">Your page</text>

  <path class="ln" d="M600 192 V222 M156 222 H1064 M156 222 V250 M372 222 V250 M620 222 V250 M868 222 V250 M1064 222 V250"/>

  <!-- 1 -->
  <rect class="box" x="56" y="250" width="200" height="176" rx="10"/>
  <text class="t" x="76" y="286">Notion's servers</text>
  <text class="d" x="76" y="314">AES-256 at rest,</text>
  <text class="d" x="76" y="336">TLS 1.2+ in transit</text>
  <text class="k kn" x="76" y="390">Notion holds the key</text>
  <text class="k kn" x="76" y="410">by default</text>

  <!-- 2 -->
  <rect class="box" x="272" y="250" width="200" height="176" rx="10"/>
  <text class="t" x="292" y="286">Backups</text>
  <text class="d" x="292" y="314">taken at least</text>
  <text class="d" x="292" y="336">daily, encrypted</text>
  <text class="k kn" x="292" y="390">Notion holds the key</text>
  <text class="k kn" x="292" y="410">by default</text>

  <!-- 3 -->
  <rect class="box" x="488" y="250" width="264" height="176" rx="10"/>
  <text class="t" x="508" y="286">An AI provider</text>
  <text class="d" x="508" y="314">only if Notion AI drew on it;</text>
  <text class="d" x="508" y="336">up to 30 days, zero on Enterprise</text>
  <text class="k kn" x="508" y="390">Notion and, if used,</text>
  <text class="k kn" x="508" y="410">its provider</text>

  <!-- 4 -->
  <rect class="box" x="768" y="250" width="200" height="176" rx="10"/>
  <text class="t" x="788" y="286">Offline copy</text>
  <text class="d" x="788" y="314">desktop or mobile</text>
  <text class="d" x="788" y="336">app, that device only</text>
  <text class="k" fill="#3d3f45" x="788" y="390">On your device,</text>
  <text class="k" fill="#3d3f45" x="788" y="410">managed by the app</text>

  <!-- 5 -->
  <rect class="box" x="984" y="250" width="160" height="176" rx="10"/>
  <text class="t" x="1004" y="286">An export</text>
  <text class="d" x="1004" y="314">Markdown, HTML,</text>
  <text class="d" x="1004" y="336">PDF or CSV files</text>
  <text class="k ky" x="1004" y="400">You, entirely</text>
</svg>
