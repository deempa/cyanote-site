<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="tl-title tl-desc">
  <title id="tl-title">Which TickTick free-plan limit you hit first, and whether to pay</title>
  <desc id="tl-desc">Six needs with TickTick's free and Premium limits. Lists: 9 free, 299 Premium, pay only past nine live lists. Habits: 5 free, 299 Premium, rarely worth it alone. Reminders on one task: 2 free, 5 plus constant reminders on Premium, pay if you miss things at two. Planning the week on a calendar: basic without durations free, all views and durations on Premium, the main reason to pay. Saved filters: none free, included in Premium, pay on a long list. People on a shared list: 2 including you free, 29 Premium, and only the list owner pays.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .row  { fill: #f6f7f9; }
    .h    { font-size: 24px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .ch   { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .rl   { font-size: 19px; font-weight: 600; fill: #0a0a0b; }
    .v    { font-size: 18px; fill: #3d3f45; }
    .d    { font-size: 15px; fill: #71757e; }
    .ok   { font-size: 18px; font-weight: 600; fill: #0e7cc4; }
    .no   { font-size: 18px; fill: #71757e; }
    .mid  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    @media (prefers-color-scheme: dark) {
      .h, .rl { fill: #f4f4f5; }
      .note, .d, .no { fill: #a4a8b0; }
      .ch, .v, .mid { fill: #d4d6db; }
      .ok { fill: #6db8ea; }
      .card { fill: #16171a; stroke: #2e3036; }
      .row  { fill: #202226; }
    }
  </style>
  <rect class="card" x="24" y="20" width="1152" height="600" rx="12"/>
  <text class="h" x="56" y="66">Which limit stops you first, and is it worth paying to lift?</text>
  <text class="note" x="56" y="94">TickTick's free and Premium limits, from its comparison table on 23 November 2026.</text>
  <text class="ch" x="80" y="140">What you need</text>
  <text class="ch" x="430" y="140">Free</text>
  <text class="ch" x="650" y="140">Premium</text>
  <text class="ch" x="890" y="140">Pay for it?</text>

  <rect class="row" x="56" y="156" width="1088" height="66" rx="10"/>
  <text class="rl" x="80" y="185">Lists</text>
  <text class="d" x="80" y="207">work, home, each project</text>
  <text class="v" x="430" y="196">9</text>
  <text class="v" x="650" y="196">299</text>
  <text class="no" x="890" y="196">Only past nine live lists</text>

  <rect class="row" x="56" y="231" width="1088" height="66" rx="10"/>
  <text class="rl" x="80" y="260">Habits</text>
  <text class="d" x="80" y="282">daily or weekly check-ins</text>
  <text class="v" x="430" y="271">5</text>
  <text class="v" x="650" y="271">299</text>
  <text class="no" x="890" y="271">Rarely worth it alone</text>

  <rect class="row" x="56" y="306" width="1088" height="66" rx="10"/>
  <text class="rl" x="80" y="335">Reminders on one task</text>
  <text class="d" x="80" y="357">the day before, an hour before</text>
  <text class="v" x="430" y="346">2</text>
  <text class="v" x="650" y="346">5, plus constant ones</text>
  <text class="mid" x="890" y="346">If you miss things at two</text>

  <rect class="row" x="56" y="381" width="1088" height="66" rx="10"/>
  <text class="rl" x="80" y="410">Planning the week on a calendar</text>
  <text class="d" x="80" y="432">drag tasks into time slots</text>
  <text class="v" x="430" y="421">Basic, no durations</text>
  <text class="v" x="650" y="421">All views, durations</text>
  <text class="ok" x="890" y="421">Yes, the main reason</text>

  <rect class="row" x="56" y="456" width="1088" height="66" rx="10"/>
  <text class="rl" x="80" y="485">Saved filters</text>
  <text class="d" x="80" y="507">high priority and due this week</text>
  <text class="v" x="430" y="496">None</text>
  <text class="v" x="650" y="496">Yes</text>
  <text class="ok" x="890" y="496">Yes, on a long list</text>

  <rect class="row" x="56" y="531" width="1088" height="66" rx="10"/>
  <text class="rl" x="80" y="560">People on a shared list</text>
  <text class="d" x="80" y="582">household, partner, team</text>
  <text class="v" x="430" y="571">2, including you</text>
  <text class="v" x="650" y="571">29</text>
  <text class="ok" x="890" y="571">Yes, only the owner pays</text>

</svg>
