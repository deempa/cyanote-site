<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="tw-title tw-desc">
  <title id="tw-title">Where Mac text replacements work</title>
  <desc id="tw-desc">Three columns. Apple text system: TextEdit, Notes and Safari; fix by ticking Edit, Substitutions, Text Replacement. Browser engines: Chrome has the same menu, Firefox works except in email and URL fields, and a website can turn it off. Own list: Word uses AutoCorrect, Google Docs uses its own Substitutions, Pages has an extra list; add the entry there.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 22px; font-weight: 600; fill: #0a0a0b; }
    .lbl  { font-size: 19px; font-weight: 600; fill: #0a0a0b; }
    .sub  { font-size: 17px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .box  { fill: #f4f4f5; stroke: #e6e6e9; stroke-width: 2; }
    .boxa { fill: #e8f3fb; stroke: #7fbde3; stroke-width: 2; }
    .arr  { stroke: #71757e; stroke-width: 3; fill: none; }
    .head { fill: #71757e; }
    @media (prefers-color-scheme: dark) {
      .h, .lbl { fill: #f4f4f5; }
      .sub { fill: #a4a8b0; }
      .card { fill: #16171a; stroke: #2e3036; }
      .box  { fill: #202226; stroke: #34363c; }
      .boxa { fill: #12293a; stroke: #2f77a8; }
      .arr  { stroke: #a4a8b0; }
      .head { fill: #a4a8b0; }
    }
  </style>
  <rect class="card" x="24" y="24" width="1152" height="512" rx="12"/>
  <text class="h" x="52" y="68">Three kinds of app, three different fixes</text>
  <rect class="box" x="52" y="96" width="352" height="196" rx="10"/>
  <text class="lbl" x="76" y="136">Apple&#8217;s text system</text>
  <text class="sub" x="76" y="176">TextEdit, Notes, Safari</text>
  <text class="sub" x="76" y="210">Uses the Mac&#8217;s list</text>
  <text class="sub" x="76" y="244">if the app&#8217;s tick is on</text>
  <path class="arr" d="M228 296 V314"/><polygon class="head" points="220,312 228,326 236,312"/>
  <rect class="box" x="52" y="330" width="352" height="182" rx="10"/>
  <text class="lbl" x="76" y="368">If it fails</text>
  <text class="sub" x="76" y="406">Edit &#8594; Substitutions</text>
  <text class="sub" x="76" y="440">&#8594; Text Replacement</text>
  <text class="sub" x="76" y="474">Untick it, then tick it</text>
  <rect class="boxa" x="424" y="96" width="352" height="196" rx="10"/>
  <text class="lbl" x="448" y="136">A browser&#8217;s own support</text>
  <text class="sub" x="448" y="176">Chrome: same Edit menu</text>
  <text class="sub" x="448" y="210">Firefox: most fields, but</text>
  <text class="sub" x="448" y="244">not email or URL fields</text>
  <path class="arr" d="M600 296 V314"/><polygon class="head" points="592,312 600,326 608,312"/>
  <rect class="boxa" x="424" y="330" width="352" height="182" rx="10"/>
  <text class="lbl" x="448" y="368">If it fails</text>
  <text class="sub" x="448" y="406">Try another website</text>
  <text class="sub" x="448" y="440">The page may have</text>
  <text class="sub" x="448" y="474">switched it off</text>
  <rect class="box" x="796" y="96" width="352" height="196" rx="10"/>
  <text class="lbl" x="820" y="136">A list of its own</text>
  <text class="sub" x="820" y="176">Word: AutoCorrect</text>
  <text class="sub" x="820" y="210">Google Docs: Substitutions</text>
  <text class="sub" x="820" y="244">Pages: an extra list</text>
  <path class="arr" d="M972 296 V314"/><polygon class="head" points="964,312 972,326 980,312"/>
  <rect class="box" x="796" y="330" width="352" height="182" rx="10"/>
  <text class="lbl" x="820" y="368">If it fails</text>
  <text class="sub" x="820" y="406">Add the entry to</text>
  <text class="sub" x="820" y="440">that app&#8217;s own list</text>
  <text class="sub" x="820" y="474">as well as the Mac&#8217;s</text>
</svg>
