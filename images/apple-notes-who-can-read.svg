<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-labelledby="wr-title wr-desc">
  <title id="wr-title">Who can read an Apple Notes note, by setting</title>
  <desc id="wr-desc">Four kinds of note against three people who might try to read it. An iCloud note on the default Standard Data Protection: Apple holds the keys and can decrypt it; someone with your powered-off Mac is stopped by FileVault; someone using your unlocked Mac can read it. An iCloud note with Advanced Data Protection: Apple cannot decrypt it; FileVault covers the powered-off Mac; the unlocked Mac can read it. A locked note: Apple cannot decrypt it, it stays encrypted on the disk, and someone at your unlocked Mac needs the note's password. A note stored On My Mac: it never goes to Apple; FileVault covers the powered-off Mac; the unlocked Mac can read it.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .row  { fill: #f6f7f9; }
    .h    { font-size: 26px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .ch   { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .rl   { font-size: 20px; font-weight: 600; fill: #0a0a0b; }
    .rs   { font-size: 16px; fill: #71757e; }
    .ok   { font-size: 18px; font-weight: 600; fill: #0e7cc4; }
    .no   { font-size: 18px; font-weight: 600; fill: #b4441f; }
    .mid  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .d    { font-size: 15px; fill: #71757e; }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="584" rx="12"/>
  <text class="h" x="56" y="66">Who can read the note?</text>
  <text class="note" x="56" y="94">Apple Notes on a Mac, from Apple's iCloud data security overview and Platform Security guide, checked 9 October 2026.</text>

  <!-- column heads -->
  <text class="ch" x="440" y="146">Apple, on its servers</text>
  <text class="ch" x="690" y="146">Someone holding</text>
  <text class="ch" x="690" y="168">your Mac, switched off</text>
  <text class="ch" x="940" y="146">Someone using your</text>
  <text class="ch" x="940" y="168">unlocked Mac</text>

  <!-- row 1 -->
  <rect class="row" x="56" y="190" width="1088" height="88" rx="10"/>
  <text class="rl" x="80" y="228">iCloud note, default</text>
  <text class="rs" x="80" y="254">Standard Data Protection</text>
  <text class="no" x="440" y="228">Can decrypt</text>
  <text class="d" x="440" y="254">Apple holds the keys</text>
  <text class="mid" x="690" y="228">Stopped by FileVault</text>
  <text class="d" x="690" y="254">if FileVault is on</text>
  <text class="no" x="940" y="228">Can read it</text>
  <text class="d" x="940" y="254">it opens like any note</text>

  <!-- row 2 -->
  <rect class="row" x="56" y="292" width="1088" height="88" rx="10"/>
  <text class="rl" x="80" y="330">iCloud note, ADP on</text>
  <text class="rs" x="80" y="356">Advanced Data Protection</text>
  <text class="ok" x="440" y="330">Cannot decrypt</text>
  <text class="d" x="440" y="356">keys on your devices</text>
  <text class="mid" x="690" y="330">Stopped by FileVault</text>
  <text class="d" x="690" y="356">if FileVault is on</text>
  <text class="no" x="940" y="330">Can read it</text>
  <text class="d" x="940" y="356">ADP is about the server</text>

  <!-- row 3 -->
  <rect class="row" x="56" y="394" width="1088" height="88" rx="10"/>
  <text class="rl" x="80" y="432">Locked note</text>
  <text class="rs" x="80" y="458">any account, own password</text>
  <text class="ok" x="440" y="432">Cannot decrypt</text>
  <text class="d" x="440" y="458">end-to-end encrypted</text>
  <text class="ok" x="690" y="432">Cannot read it</text>
  <text class="d" x="690" y="458">encrypted on the disk too</text>
  <text class="ok" x="940" y="432">Needs the password</text>
  <text class="d" x="940" y="458">once the note has closed</text>

  <!-- row 4 -->
  <rect class="row" x="56" y="496" width="1088" height="88" rx="10"/>
  <text class="rl" x="80" y="534">On My Mac note</text>
  <text class="rs" x="80" y="560">never synced to iCloud</text>
  <text class="ok" x="440" y="534">Never uploaded</text>
  <text class="d" x="440" y="560">no server copy</text>
  <text class="mid" x="690" y="534">Stopped by FileVault</text>
  <text class="d" x="690" y="560">if FileVault is on</text>
  <text class="no" x="940" y="534">Can read it</text>
  <text class="d" x="940" y="560">it opens like any note</text>
</svg>
