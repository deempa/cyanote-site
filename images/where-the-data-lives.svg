<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="wd-title wd-desc">
  <title id="wd-title">Where a Mac app can keep what you write</title>
  <desc id="wd-desc">Four arrangements: one database file in Application Support, plain text files in a folder you chose, a sandboxed container, or a cache of a server you cannot reach. The first three give you a path you can back up and a format you can read; the fourth means the local file is much smaller than what you have written.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 22px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 19px; fill: #3d3f45; }
    .note { font-size: 18px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="270" height="340" rx="12"/>
  <rect x="24" y="30" width="270" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="50" y="84">One database file</text>
  <text class="mono" x="50" y="120">~/Library/</text>
  <text class="mono" x="50" y="142">Application Support/</text>
  <line x1="50" y1="168" x2="268" y2="168" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="50" y="204">Back up: one copy</text>
  <text class="item" x="50" y="240">Read it: sqlite3,</text>
  <text class="item" x="50" y="264">already on your Mac</text>
  <text class="note" x="50" y="316">The usual home for</text>
  <text class="note" x="50" y="340">structured content.</text>

  <rect class="card" x="314" y="30" width="270" height="340" rx="12"/>
  <rect x="314" y="30" width="270" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="340" y="84">Files in a folder</text>
  <text class="mono" x="340" y="120">~/Notes/*.md</text>
  <line x1="340" y1="168" x2="558" y2="168" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="340" y="204">Back up: copy it</text>
  <text class="item" x="340" y="240">Read it: any editor,</text>
  <text class="item" x="340" y="264">grep, anything</text>
  <text class="note" x="340" y="316">Prose travels. Links</text>
  <text class="note" x="340" y="340">and state may not.</text>

  <rect class="card" x="604" y="30" width="270" height="340" rx="12"/>
  <rect x="604" y="30" width="270" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="630" y="84">A container</text>
  <text class="mono" x="630" y="120">~/Library/</text>
  <text class="mono" x="630" y="142">Containers/…/Data/</text>
  <line x1="630" y1="168" x2="848" y2="168" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="630" y="204">Back up: same idea</text>
  <text class="item" x="630" y="240">Read it: depends on</text>
  <text class="item" x="630" y="264">the format inside</text>
  <text class="note" x="630" y="316">Sandboxed apps.</text>
  <text class="note" x="630" y="340">Awkward by hand.</text>

  <rect class="card" x="894" y="30" width="276" height="340" rx="12"/>
  <rect x="894" y="30" width="276" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="920" y="84">A cache of a server</text>
  <text class="mono" x="920" y="120">…/Caches/</text>
  <line x1="920" y1="168" x2="1144" y2="168" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="920" y="204">Back up: not useful</text>
  <text class="item" x="920" y="240">Read it: partial, and</text>
  <text class="item" x="920" y="264">only what you opened</text>
  <text class="note" x="920" y="316">The tell: far smaller</text>
  <text class="note" x="920" y="340">than what you wrote.</text>

  <text class="foot" x="24" y="428">Find the path in Settings, or press ⇧⌘G in Finder and type ~/Library/Application Support/</text>
</svg>
