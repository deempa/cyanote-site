<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="dec-title dec-desc">
  <title id="dec-title">The same note, and what stops resolving three years later</title>
  <desc id="dec-desc">On the left, a note written in year one: dated 14 slash 3, it says the other one was checked against S's version, the same problem as before came up, so the second approach should be used for now, with files in a home directory path. On the right, six of its references no longer point at anything: the other one, S, the same problem, the second approach, for now, and the file path, which moved. Nothing in the note changed; the context around it went away.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lbl  { font-size: 14px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .lblr { font-size: 14px; font-weight: 600; fill: #b3392c; letter-spacing: .05em; }
    .body { font-size: 17px; fill: #3d3f45; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tok  { font-size: 16px; font-weight: 600; fill: #b3392c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .q    { font-size: 15px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="48" width="520" height="332" rx="12"/>
  <rect x="24" y="48" width="520" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl" x="56" y="90">THE NOTE, AS WRITTEN IN YEAR ONE</text>
  <line x1="56" y1="112" x2="512" y2="112" stroke="#e6e6e9" stroke-width="2"/>
  <text class="body" x="56" y="154">14/3 &#8212; Checked the other one against</text>
  <text class="body" x="56" y="186">S&#8217;s version. Same problem as before,</text>
  <text class="body" x="56" y="218">so use the second approach for now.</text>
  <text class="body" x="56" y="250">Files in ~/work/data/final2/.</text>
  <text class="q"    x="56" y="316">Perfectly clear on the day it was written,</text>
  <text class="q"    x="56" y="340">and never edited since.</text>

  <rect class="card" x="580" y="48" width="596" height="332" rx="12"/>
  <rect x="580" y="48" width="596" height="7" rx="3.5" fill="#b3392c"/>
  <text class="lblr" x="612" y="90">WHAT IT POINTS AT, IN YEAR FOUR</text>
  <line x1="612" y1="112" x2="1144" y2="112" stroke="#e6e6e9" stroke-width="2"/>
  <text class="tok" x="612" y="150">the other one</text>
  <text class="q"   x="900" y="150">which of the three versions?</text>
  <text class="tok" x="612" y="186">S</text>
  <text class="q"   x="900" y="186">three cohorts have passed</text>
  <text class="tok" x="612" y="222">same problem</text>
  <text class="q"   x="900" y="222">never named anywhere</text>
  <text class="tok" x="612" y="258">second approach</text>
  <text class="q"   x="900" y="258">the two were never listed</text>
  <text class="tok" x="612" y="294">for now</text>
  <text class="q"   x="900" y="294">until when? still in use?</text>
  <text class="tok" x="612" y="330">~/work/data/final2/</text>
  <text class="q"   x="900" y="330">reorganised twice since</text>

  <line x1="24" y1="416" x2="1176" y2="416" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="452">Nothing in the note changed. Six of its references simply stopped having anything to point at.</text>
  <text class="foot" x="24" y="482">Naming each one instead of pointing at it would have cost about six words.</text>
</svg>
