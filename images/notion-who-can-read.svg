<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-labelledby="nw-title nw-desc">
  <title id="nw-title">Who can read a private Notion page, and when</title>
  <desc id="nw-desc">Five parties who can reach a private Notion page. Other Notion users cannot, unless you share the page. Notion support can, but only after you turn on support access, which ends after 28 days by default. Notion may disclose it to law enforcement when it believes that is required or appropriate, such as for a court order or subpoena, and that is not something you can switch off. AI providers such as Anthropic and OpenAI may process page content when you use Notion AI, and keep it for up to 30 days outside the Enterprise plan. On an Enterprise workspace, the workspace owner may access your content.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .row  { fill: #f6f7f9; }
    .h    { font-size: 26px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .ch   { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .rl   { font-size: 20px; font-weight: 600; fill: #0a0a0b; }
    .ok   { font-size: 18px; font-weight: 600; fill: #0e7cc4; }
    .no   { font-size: 18px; font-weight: 600; fill: #b4441f; }
    .mid  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .d    { font-size: 15px; fill: #71757e; }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="624" rx="12"/>
  <text class="h" x="56" y="66">Who can reach a private Notion page?</text>
  <text class="note" x="56" y="94">From Notion's help centre, security page and privacy policy, checked 15 October 2026.</text>

  <text class="ch" x="80" y="146">Who</text>
  <text class="ch" x="420" y="146">Can they?</text>
  <text class="ch" x="760" y="146">What you control</text>

  <!-- row 1 -->
  <rect class="row" x="56" y="166" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="212">Other Notion users</text>
  <text class="ok" x="420" y="202">No</text>
  <text class="d" x="420" y="226">unless the page is shared</text>
  <text class="mid" x="760" y="202">Fully yours</text>
  <text class="d" x="760" y="226">the Share menu decides</text>

  <!-- row 2 -->
  <rect class="row" x="56" y="258" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="304">Notion support</text>
  <text class="mid" x="420" y="294">Only with your consent</text>
  <text class="d" x="420" y="318">to troubleshoot or recover content</text>
  <text class="mid" x="760" y="294">Support access toggle</text>
  <text class="d" x="760" y="318">ends after 28 days by default</text>

  <!-- row 3 -->
  <rect class="row" x="56" y="350" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="396">Law enforcement</text>
  <text class="no" x="420" y="386">Possibly, via Notion</text>
  <text class="d" x="420" y="410">court order, subpoena, other legal process</text>
  <text class="no" x="760" y="386">Nothing</text>
  <text class="d" x="760" y="410">Notion holds the keys by default</text>

  <!-- row 4 -->
  <rect class="row" x="56" y="442" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="480">AI providers</text>
  <text class="d" x="80" y="504">Anthropic, OpenAI and others</text>
  <text class="mid" x="420" y="478">May, when you use Notion AI</text>
  <text class="d" x="420" y="502">kept up to 30 days, zero on Enterprise</text>
  <text class="mid" x="760" y="478">Whether you use AI on it</text>
  <text class="d" x="760" y="502">not used for training, by default</text>

  <!-- row 5 -->
  <rect class="row" x="56" y="534" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="572">Workspace owner</text>
  <text class="d" x="80" y="596">company workspace</text>
  <text class="no" x="420" y="570">May, on Enterprise</text>
  <text class="d" x="420" y="594">including admin content search</text>
  <text class="mid" x="760" y="570">Which workspace you write in</text>
  <text class="d" x="760" y="594">keep personal pages out of work</text>
</svg>
