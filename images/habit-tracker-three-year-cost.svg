<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="ht-title ht-desc">
  <title id="ht-title">What three years of habit tracking costs on a Mac</title>
  <desc id="ht-desc">Three-year cost for one person at list prices on 7 October 2026, before tax, using the cheapest way past each free tier's limits. Notion's Free plan with a habit template costs $0. Streaks costs $5.99 once. Cyanote costs $7.99 once. Habitify Premium costs $59.99 once as a lifetime licence, or $89.64 over three years billed yearly at $29.88. Lunatask Premium costs $216 over three years billed yearly at $72, or $300 once as a lifetime licence.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .lbl  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .val  { font-size: 17px; fill: #3d3f45; }
    .grid { stroke: #e6e6e9; stroke-width: 2; }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="520" rx="12"/>
  <text class="h" x="56" y="66">Three years of habit tracking on a Mac, one person</text>
  <text class="note" x="56" y="94">List prices on 7 October 2026, before tax, held flat. Cheapest way past each free tier's habit limit.</text>
  <line class="grid" x1="400" y1="140" x2="400" y2="500"/>
  <text class="lbl" x="380" y="172" text-anchor="end">Notion, Free plan + a template</text>
  <rect x="400" y="154" width="4.0" height="26" rx="4" fill="#a3a7af"/>
  <text class="val" x="418.0" y="173">$0</text>
  <text class="lbl" x="380" y="222" text-anchor="end">Streaks</text>
  <rect x="400" y="204" width="13.2" height="26" rx="4" fill="#0e7cc4"/>
  <text class="val" x="427.2" y="223">$5.99 once</text>
  <text class="lbl" x="380" y="272" text-anchor="end">Cyanote</text>
  <rect x="400" y="254" width="17.6" height="26" rx="4" fill="#0e7cc4"/>
  <text class="val" x="431.6" y="273">$7.99 once</text>
  <text class="lbl" x="380" y="322" text-anchor="end">Habitify, Premium lifetime</text>
  <rect x="400" y="304" width="132.0" height="26" rx="4" fill="#3d3f45"/>
  <text class="val" x="546.0" y="323">$59.99 once</text>
  <text class="lbl" x="380" y="372" text-anchor="end">Habitify, Premium yearly</text>
  <rect x="400" y="354" width="197.2" height="26" rx="4" fill="#3d3f45"/>
  <text class="val" x="611.2" y="373">$29.88 a year · $89.64</text>
  <text class="lbl" x="380" y="422" text-anchor="end">Lunatask, Premium yearly</text>
  <rect x="400" y="404" width="475.2" height="26" rx="4" fill="#3d3f45"/>
  <text class="val" x="889.2" y="423">$72 a year · $216</text>
  <text class="lbl" x="380" y="472" text-anchor="end">Lunatask, Lifetime</text>
  <rect x="400" y="454" width="660.0" height="26" rx="4" fill="#3d3f45"/>
  <text class="val" x="1074.0" y="473">$300 once</text>
  <text class="note" x="56" y="516">Habitify's free plan allows 3 habits and Lunatask's 7. Streaks and Cyanote have no free tier.</text>
</svg>
