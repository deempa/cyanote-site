    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ax   { font-size: 15px; fill: #71757e; }
    .mon  { font-size: 15px; fill: #71757e; text-anchor: middle; }
    .key  { font-size: 16px; fill: #3d3f45; }
    .cal  { font-size: 17px; font-weight: 600; fill: #b3392c; text-anchor: middle; }
    .foot { font-size: 19px; fill: #3d3f45; }
  </style>

