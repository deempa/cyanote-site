<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="ev-title ev-desc">
  <title id="ev-title">Flat estimated billing against what the house actually used</title>
  <desc id="ev-desc">Twelve months of billing. For eleven months the bill is a flat forty-five pounds, shown as short grey bars. A blue line shows what the house actually used each month, which is far higher in winter — ninety-five pounds in January — and lower in summer, dipping to thirty pounds. The line runs far above the bars through the winter and dips below them in summer, so a shortfall builds up across the year as a whole. In December a catch-up bill of two hundred and twenty-seven pounds arrives, shown as a tall red bar. The yearly total is seven hundred and twenty-two pounds either way.</desc>
