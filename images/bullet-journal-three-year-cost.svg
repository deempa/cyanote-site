<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="bc-title bc-desc">
  <title id="bc-title">What three years of a digital bullet journal costs on a Mac</title>
  <desc id="bc-desc">Three-year cost for one person at list prices on 13 October 2026, before tax. Obsidian, Logseq and Apple Notes cost $0. Cyanote costs $7.99 once. Goodnotes 6 costs $28.99 as a one-time App Store purchase, or $35.97 over three years on the Essential plan at $11.99 a year. Bullet: Daily Planner costs $79.99 for its lifetime purchase. NotePlan costs $297 over three years at $99 a year.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .lbl  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .val  { font-size: 17px; fill: #3d3f45; }
    .grid { stroke: #e6e6e9; stroke-width: 2; }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="480" rx="12"/>
  <text class="h" x="56" y="66">Three years of a digital bullet journal on a Mac, one person</text>
  <text class="note" x="56" y="94">List prices on 13 October 2026, before tax, held flat. Cheapest way to keep using each one past its free tier.</text>
  <line class="grid" x1="400" y1="130" x2="400" y2="470"/>

  <text class="lbl" x="380" y="162" text-anchor="end">Obsidian, Logseq, Apple Notes</text>
  <rect x="400" y="144" width="4" height="26" rx="4" fill="#a3a7af"/>
  <text class="val" x="418" y="163">$0</text>

  <text class="lbl" x="380" y="212" text-anchor="end">Cyanote</text>
  <rect x="400" y="194" width="18.8" height="26" rx="4" fill="#0e7cc4"/>
  <text class="val" x="432.8" y="213">$7.99 once</text>

  <text class="lbl" x="380" y="262" text-anchor="end">Goodnotes 6, one-time</text>
  <rect x="400" y="244" width="68.3" height="26" rx="4" fill="#3d3f45"/>
  <text class="val" x="482.3" y="263">$28.99 once</text>

  <text class="lbl" x="380" y="312" text-anchor="end">Goodnotes, Essential plan</text>
  <rect x="400" y="294" width="84.8" height="26" rx="4" fill="#3d3f45"/>
  <text class="val" x="498.8" y="313">$35.97 over 3 years ($11.99 a year)</text>

  <text class="lbl" x="380" y="362" text-anchor="end">Bullet: Daily Planner, lifetime</text>
  <rect x="400" y="344" width="188.5" height="26" rx="4" fill="#3d3f45"/>
  <text class="val" x="602.5" y="363">$79.99 once</text>

  <text class="lbl" x="380" y="412" text-anchor="end">NotePlan, yearly</text>
  <rect x="400" y="394" width="700" height="26" rx="4" fill="#3d3f45"/>
  <text class="val" x="1090" y="413" text-anchor="end" fill="#ffffff">$297 ($99 a year)</text>

  <text class="note" x="400" y="458">Obsidian Sync, if you want it, adds $4 a month billed yearly.</text>
</svg>
