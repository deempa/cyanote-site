<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="pt-title pt-desc">
  <title id="pt-title">A broadcast keystroke against an addressed one</title>
  <desc id="pt-desc">The old design put the clipboard entry on the pasteboard and synthesised a Command-V keystroke to whatever application was frontmost, assuming that was the app the popup opened over. A mouse click on the popup could hand Cyanote the foreground first, so the entry pasted into a note. The new design captures the process id of the app that was active when the popup opened and delivers the keystroke to that process, so the wrong-app paste cannot be expressed at all.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 19px; fill: #3d3f45; }
    .gone { font-size: 19px; fill: #a3a7af; }
    .note { font-size: 18px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .step { fill: #efeff1; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="560" height="350" rx="12"/>
  <rect x="24" y="30" width="560" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="54" y="88">Broadcast &#8212; no addressee</text>
  <text class="note" x="54" y="118">&#8220;Send &#8984;V to whoever is in front&#8221;</text>
  <line x1="54" y1="146" x2="554" y2="146" stroke="#e6e6e9" stroke-width="2"/>

  <rect class="step" x="54" y="176" width="200" height="56" rx="10"/>
  <text class="item" x="74" y="211">Popup opens</text>
  <text class="gone" x="272" y="211">&#8594;</text>
  <rect class="step" x="302" y="176" width="252" height="56" rx="10"/>
  <text class="item" x="322" y="211">You click an entry</text>

  <text class="gone" x="150" y="266">&#8595;</text>
  <rect class="step" x="54" y="284" width="500" height="60" rx="10"/>
  <text class="item" x="74" y="311">&#8984;V goes to the frontmost app &#8212; which the</text>
  <text class="item" x="74" y="335">click may have just made Cyanote itself</text>
  <text class="note" x="54" y="368">Guards were added. Each one narrowed a wrong design.</text>

  <rect class="card" x="614" y="30" width="562" height="350" rx="12"/>
  <rect x="614" y="30" width="562" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="644" y="88">Addressed &#8212; one named process</text>
  <text class="note" x="644" y="118">&#8220;Send &#8984;V to pid 4471&#8221;</text>
  <line x1="644" y1="146" x2="1146" y2="146" stroke="#e6e6e9" stroke-width="2"/>

  <rect class="step" x="644" y="176" width="290" height="56" rx="10"/>
  <text class="item" x="664" y="211">Popup opens &#8212; records pid</text>
  <text class="gone" x="952" y="211">&#8594;</text>
  <rect class="step" x="982" y="176" width="164" height="56" rx="10"/>
  <text class="item" x="1002" y="211">You click</text>

  <text class="gone" x="740" y="266">&#8595;</text>
  <rect class="step" x="644" y="284" width="502" height="60" rx="10"/>
  <text class="item" x="664" y="311">&#8984;V is delivered to that pid, whatever</text>
  <text class="item" x="664" y="335">happens to be in front now</text>
  <text class="note" x="644" y="368">Not guarded against. Unrepresentable.</text>

  <text class="foot" x="24" y="436">The clipboard also hands the foreground back before its panel goes away &#8212; otherwise AppKit raises Cyanote on the way out.</text>
</svg>
