<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="svd-title svd-desc">
  <title id="svd-title">A scratchpad lifecycle next to a document lifecycle</title>
  <desc id="svd-desc">A scratchpad has three steps: open, type, close. Nothing is named and nothing is decided, so a thought you turn out not to need costs nothing. A document has five: open, type, name it, choose a folder, save. Two of those steps are decisions about a thought you have not finished having, and you are left owning a file whether or not you wanted one.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 22px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 21px; fill: #3d3f45; }
    .note { font-size: 20px; fill: #71757e; }
    .lbl  { font-size: 15px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .step { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .ask  { fill: #ffffff; stroke: #b8bcc4; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
  </style>

  <!-- scratchpad -->
  <rect class="card" x="24" y="24" width="1152" height="168" rx="12"/>
  <rect x="24" y="24" width="1152" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl" x="56" y="64">A SCRATCHPAD</text>

  <rect class="step" x="56" y="88" width="185" height="54" rx="10"/>
  <text class="item" x="148.5" y="122" text-anchor="middle">Open</text>
  <line x1="249" y1="115" x2="265" y2="115" stroke="#b8bcc4" stroke-width="2"/>
  <path d="M265 109 L273 115 L265 121 Z" fill="#b8bcc4"/>

  <rect class="step" x="281" y="88" width="185" height="54" rx="10"/>
  <text class="item" x="373.5" y="122" text-anchor="middle">Type</text>
  <line x1="474" y1="115" x2="490" y2="115" stroke="#b8bcc4" stroke-width="2"/>
  <path d="M490 109 L498 115 L490 121 Z" fill="#b8bcc4"/>

  <rect class="step" x="506" y="88" width="185" height="54" rx="10"/>
  <text class="item" x="598.5" y="122" text-anchor="middle">Close</text>

  <text class="note" x="740" y="108">Nothing was named.</text>
  <text class="note" x="740" y="136">Nothing was decided.</text>

  <text class="h" x="56" y="174">A thought you turn out not to need costs you nothing.</text>

  <!-- document -->
  <rect class="card" x="24" y="212" width="1152" height="168" rx="12"/>
  <rect x="24" y="212" width="1152" height="7" rx="3.5" fill="#b8bcc4"/>
  <text class="lbl" x="56" y="252">A DOCUMENT</text>

  <rect class="step" x="56" y="276" width="185" height="54" rx="10"/>
  <text class="item" x="148.5" y="310" text-anchor="middle">Open</text>
  <line x1="249" y1="303" x2="265" y2="303" stroke="#b8bcc4" stroke-width="2"/>
  <path d="M265 297 L273 303 L265 309 Z" fill="#b8bcc4"/>

  <rect class="step" x="281" y="276" width="185" height="54" rx="10"/>
  <text class="item" x="373.5" y="310" text-anchor="middle">Type</text>
  <line x1="474" y1="303" x2="490" y2="303" stroke="#b8bcc4" stroke-width="2"/>
  <path d="M490 297 L498 303 L490 309 Z" fill="#b8bcc4"/>

  <rect class="ask" x="506" y="276" width="185" height="54" rx="10"/>
  <text class="item" x="598.5" y="310" text-anchor="middle">Name it</text>
  <line x1="699" y1="303" x2="715" y2="303" stroke="#b8bcc4" stroke-width="2"/>
  <path d="M715 297 L723 303 L715 309 Z" fill="#b8bcc4"/>

  <rect class="ask" x="731" y="276" width="185" height="54" rx="10"/>
  <text class="item" x="823.5" y="310" text-anchor="middle">Choose a folder</text>
  <line x1="924" y1="303" x2="940" y2="303" stroke="#b8bcc4" stroke-width="2"/>
  <path d="M940 297 L948 303 L940 309 Z" fill="#b8bcc4"/>

  <rect class="step" x="956" y="276" width="185" height="54" rx="10"/>
  <text class="item" x="1048.5" y="310" text-anchor="middle">Save</text>

  <text class="h" x="56" y="362">The same thought costs a filename, a folder, and a file you now own.</text>

  <text class="foot" x="24" y="416">The two outlined steps are the whole difference. They are asked before you have finished having the</text>
  <text class="foot" x="24" y="448">thought, and they are charged every time &#8212; which is why Notepad felt weightless and TextEdit does not.</text>
</svg>
