<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="wc-title wc-desc">
  <title id="wc-title">Four ways something reaches the Cyanote calendar</title>
  <desc id="wc-desc">Events you create, tasks with a due date and imported .ics files all stay on the PC and make no network requests. A subscribed iCal address is a read-only mirror, re-checked every thirty minutes, and it is the only one that fetches anything.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 19px; fill: #3d3f45; }
    .note { font-size: 18px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <!-- events you create -->
  <rect class="card" x="24" y="30" width="270" height="330" rx="12"/>
  <rect x="24" y="30" width="270" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="50" y="86">Events you create</text>
  <text class="note" x="50" y="116">Stored in the local database</text>
  <text class="item" x="50" y="190">Editable, draggable</text>
  <text class="item" x="50" y="220">Repeat and remind</text>
  <text class="note" x="50" y="326">No network.</text>

  <!-- tasks -->
  <rect class="card" x="319" y="30" width="270" height="330" rx="12"/>
  <rect x="319" y="30" width="270" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="345" y="86">Tasks with a date</text>
  <text class="note" x="345" y="116">The same tasks as the list</text>
  <text class="item" x="345" y="190">Shown on their day,</text>
  <text class="item" x="345" y="220">ticked off in place</text>
  <text class="note" x="345" y="326">No network.</text>

  <!-- import -->
  <rect class="card" x="614" y="30" width="270" height="330" rx="12"/>
  <rect x="614" y="30" width="270" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="640" y="86">An imported .ics</text>
  <text class="note" x="640" y="116">A one-off copy</text>
  <text class="item" x="640" y="190">Becomes your events,</text>
  <text class="item" x="640" y="220">never re-checked</text>
  <text class="note" x="640" y="326">No network.</text>

  <!-- subscription -->
  <rect class="card" x="909" y="30" width="267" height="330" rx="12"/>
  <rect x="909" y="30" width="267" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="935" y="86">A subscription</text>
  <text class="note" x="935" y="116">An iCal address you paste</text>
  <text class="item" x="935" y="190">Read-only mirror,</text>
  <text class="item" x="935" y="220">re-checked every 30 min</text>
  <text class="note" x="935" y="300">One fetch each time,</text>
  <text class="note" x="935" y="326">and only if you add it.</text>

  <text class="foot" x="24" y="420">Three of the four never leave the PC. The fourth only exists if you paste an address into it.</text>
</svg>
