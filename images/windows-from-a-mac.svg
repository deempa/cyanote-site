<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="wm-title wm-desc">
  <title id="wm-title">Verifying platform code you cannot run on the machine writing it</title>
  <desc id="wm-desc">Three layers of confidence when developing Windows code on a Mac. The compiler catches type and API mistakes on the platform being built for. Continuous integration is the only thing that exercises a real Windows build, so a job configured to produce no installer sees nothing. And the platform rules that cannot be executed at all — such as classifying clipboard privacy marks — have to be written as pure functions and unit-tested, with a fail-closed default for anything unclassifiable.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 21px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 17px; fill: #3d3f45; }
    .note { font-size: 16px; fill: #71757e; }
    .lbl  { font-size: 15px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
    .bad  { font-size: 17px; font-weight: 600; fill: #b3392c; }
  </style>

  <rect class="card" x="24" y="30" width="368" height="300" rx="12"/>
  <rect x="24" y="30" width="368" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl" x="56" y="72">LAYER ONE</text>
  <text class="h" x="56" y="106">The compiler</text>
  <line x1="56" y1="130" x2="360" y2="130" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="56" y="164">Missing APIs</text>
  <text class="item" x="56" y="194">Variants that do not exist</text>
  <text class="item" x="56" y="224">Types, signatures, features</text>
  <text class="note" x="56" y="270">Free and immediate &#8212; but only if</text>
  <text class="note" x="56" y="294">something actually compiles it.</text>

  <rect class="card" x="416" y="30" width="368" height="300" rx="12"/>
  <rect x="416" y="30" width="368" height="7" rx="3.5" fill="#b3392c"/>
  <text class="lbl" x="448" y="72">LAYER TWO</text>
  <text class="h" x="448" y="106">The build job</text>
  <line x1="448" y1="130" x2="752" y2="130" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="448" y="164">The only real Windows build</text>
  <text class="item" x="448" y="194">Installer, signature, payload name</text>
  <text class="bad" x="448" y="224">Targets set to macOS only</text>
  <text class="note" x="448" y="270">Produced nothing, reported success,</text>
  <text class="note" x="448" y="294">and hid a compile error for a week.</text>

  <rect class="card" x="808" y="30" width="368" height="300" rx="12"/>
  <rect x="808" y="30" width="368" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl" x="840" y="72">LAYER THREE</text>
  <text class="h" x="840" y="106">Rules as pure functions</text>
  <line x1="840" y1="130" x2="1144" y2="130" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="840" y="164">Marks in, decision out</text>
  <text class="item" x="840" y="194">Unit-tested on the Mac</text>
  <text class="item" x="840" y="224">Unclassifiable &#8594; private</text>
  <text class="note" x="840" y="270">Cannot prove the platform call works.</text>
  <text class="note" x="840" y="294">Can prove the decision is right.</text>

  <line x1="24" y1="370" x2="1176" y2="370" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="408">When you cannot run the code, every downstream step takes its facts from a description of the</text>
  <text class="foot" x="24" y="440">thing rather than the thing &#8212; so one wrong assumption propagates at the speed of copy-paste.</text>
</svg>
