<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">What still runs when the money stops</title>
  <desc id="sp-desc">Three cases, from Setapp's support pages and developers' own terms. When a Setapp membership ends, it runs to the end of the paid period; after that the apps stay installed but cannot be used. When an app leaves Setapp while you are still a member, it keeps working if it is installed, but gets no more updates and cannot be reinstalled once removed. An app you bought once from its developer keeps running and can usually be reinstalled; updates follow that developer's terms.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 18px; fill: #71757e; }
    .item { font-size: 19px; fill: #3d3f45; }
    .yes  { font-size: 19px; font-weight: 600; fill: #0e7cc4; }
    .no   { font-size: 19px; font-weight: 600; fill: #a3a7af; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="360" height="360" rx="12"/>
  <rect x="24" y="30" width="360" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="54" y="88">Setapp membership ends</text>
  <text class="note" x="54" y="118">You cancel your subscription</text>
  <line x1="54" y1="146" x2="354" y2="146" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="54" y="186">Works to end of period</text>
  <text class="yes" x="354" y="186" text-anchor="end">Yes</text>
  <text class="item" x="54" y="222">Apps still installed</text>
  <text class="yes" x="354" y="222" text-anchor="end">Yes</text>
  <text class="item" x="54" y="258">Apps still usable</text>
  <text class="no" x="354" y="258" text-anchor="end">No</text>
  <line x1="54" y1="284" x2="354" y2="284" stroke="#e6e6e9" stroke-width="2"/>
  <text class="note" x="54" y="324">Your files are yours, but</text>
  <text class="note" x="54" y="348">only in formats another</text>
  <text class="note" x="54" y="372">app can open</text>

  <rect class="card" x="414" y="30" width="360" height="360" rx="12"/>
  <rect x="414" y="30" width="360" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="444" y="88">An app leaves Setapp</text>
  <text class="note" x="444" y="118">You are still a member</text>
  <line x1="444" y1="146" x2="744" y2="146" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="444" y="186">Runs, if still installed</text>
  <text class="yes" x="744" y="186" text-anchor="end">Yes</text>
  <text class="item" x="444" y="222">Gets updates</text>
  <text class="no" x="744" y="222" text-anchor="end">No</text>
  <text class="item" x="444" y="258">Reinstall after removing</text>
  <text class="no" x="744" y="258" text-anchor="end">No</text>
  <line x1="444" y1="284" x2="744" y2="284" stroke="#e6e6e9" stroke-width="2"/>
  <text class="note" x="444" y="324">Setapp emails you first,</text>
  <text class="note" x="444" y="348">so there is time to move</text>
  <text class="note" x="444" y="372">your data out</text>

  <rect class="card" x="804" y="30" width="372" height="360" rx="12"/>
  <rect x="804" y="30" width="372" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="834" y="88">An app you bought once</text>
  <text class="note" x="834" y="118">Paid to its developer</text>
  <line x1="834" y1="146" x2="1146" y2="146" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="834" y="186">Keeps running</text>
  <text class="yes" x="1146" y="186" text-anchor="end">Yes</text>
  <text class="item" x="834" y="222">Reinstall later</text>
  <text class="yes" x="1146" y="222" text-anchor="end">Usually</text>
  <text class="item" x="834" y="258">Gets updates</text>
  <text class="note" x="1146" y="258" text-anchor="end">Their terms</text>
  <line x1="834" y1="284" x2="1146" y2="284" stroke="#e6e6e9" stroke-width="2"/>
  <text class="note" x="834" y="324">Until a future macOS breaks</text>
  <text class="note" x="834" y="348">it, which can happen to any</text>
  <text class="note" x="834" y="372">app, however it was sold</text>

  <text class="foot" x="24" y="436">Sources: Setapp support, "Cancel subscription" and "Apps removed from Setapp", retrieved 5 October 2026.</text>
</svg>
