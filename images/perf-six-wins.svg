<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="pw-title pw-desc">
  <title id="pw-title">Six measured performance problems, before and after</title>
  <desc id="pw-desc">On a 10,000-note database the sidebar took 10,001 statements and 101 MB to draw a list of titles, and now takes 2 statements and 1.4 MB, falling from 527 to 47 milliseconds. A nesting lookup fell from 7.1 milliseconds to 0.007 with an index. The reminder sweep read every task and event every 30 seconds, 1.18 GB a day, and now reads only rows with a reminder armed. The clipboard poll copied any image on the pasteboard twice a second and now reads a single integer. The word count re-split the whole note on every keystroke, and the editor re-rendered on any state change at all.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .col  { font-size: 18px; font-weight: 600; fill: #0e7cc4; }
    .item { font-size: 18px; fill: #3d3f45; }
    .gone { font-size: 18px; fill: #a3a7af; }
    .win  { font-size: 18px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="24" width="1152" height="404" rx="12"/>
  <rect x="24" y="24" width="1152" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="54" y="80">Measured on a 10,000-note database, before and after</text>

  <text class="col" x="54" y="126">What it was doing</text>
  <text class="col" x="620" y="126">Was</text>
  <text class="col" x="900" y="126">Now</text>
  <line x1="54" y1="146" x2="1146" y2="146" stroke="#e6e6e9" stroke-width="2"/>

  <text class="item" x="54" y="186">Drawing the sidebar &#8212; SELECT * per launch</text>
  <text class="gone" x="620" y="186">10,001 statements</text>
  <text class="win" x="900" y="186">2 statements</text>
  <text class="note" x="54" y="210">and the whole note document, parsed then thrown away</text>
  <text class="gone" x="620" y="210">101 MB &#183; 527ms</text>
  <text class="win" x="900" y="210">1.4 MB &#183; 47ms</text>
  <line x1="54" y1="232" x2="1146" y2="232" stroke="#efeff1" stroke-width="2"/>

  <text class="item" x="54" y="270">Reminder sweep, every 30 seconds</text>
  <text class="gone" x="620" y="270">1.18 GB/day</text>
  <text class="win" x="900" y="270">armed rows only</text>
  <line x1="54" y1="292" x2="1146" y2="292" stroke="#efeff1" stroke-width="2"/>

  <text class="item" x="54" y="330">Clipboard poll, twice a second</text>
  <text class="gone" x="620" y="330">a full RGBA copy</text>
  <text class="win" x="900" y="330">one integer</text>
  <line x1="54" y1="352" x2="1146" y2="352" stroke="#efeff1" stroke-width="2"/>

  <text class="item" x="54" y="390">Nesting lookup</text>
  <text class="gone" x="620" y="390">7.1ms</text>
  <text class="win" x="900" y="390">0.007ms</text>

  <text class="foot" x="24" y="468">Not one of the six was fixed by making the drawing faster. All of them were about how much was read, and how often.</text>
</svg>
