<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="col-title col-desc">
  <title id="col-title">Sorting seven things into a calendar and a list with one question</title>
  <desc id="col-desc">The question is whether the thing happens whether or not you show up. The dentist at three, the standup at quarter past nine, a flight landing and a deadline on the thirty-first all occur without you, so they belong on the calendar. Renewing the insurance, writing the report, replying to Sam and booking a haircut need doing but have no slot, so they belong on a list with a due date.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 22px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 18px; fill: #3d3f45; }
    .time { font-size: 17px; fill: #71757e; }
    .lbl  { font-size: 15px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .q    { font-size: 20px; font-weight: 600; fill: #0e7cc4; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
  </style>

  <text class="q" x="600" y="52" text-anchor="middle">If you are not there, does it still happen?</text>

  <rect class="card" x="24" y="76" width="560" height="272" rx="12"/>
  <rect x="24" y="76" width="560" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl" x="56" y="118">YES &#8212; IT HAPPENS WITHOUT YOU</text>
  <text class="h" x="56" y="150">The calendar</text>
  <line x1="56" y1="174" x2="552" y2="174" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="56" y="208">Dentist</text>
  <text class="time" x="552" y="208" text-anchor="end">Thursday, 3pm</text>
  <text class="item" x="56" y="244">Standup</text>
  <text class="time" x="552" y="244" text-anchor="end">every weekday, 9:15</text>
  <text class="item" x="56" y="280">The flight lands</text>
  <text class="time" x="552" y="280" text-anchor="end">18:40</text>
  <text class="item" x="56" y="316">Tax return due</text>
  <text class="time" x="552" y="316" text-anchor="end">the 31st, all day</text>

  <rect class="card" x="616" y="76" width="560" height="272" rx="12"/>
  <rect x="616" y="76" width="560" height="7" rx="3.5" fill="#b8bcc4"/>
  <text class="lbl" x="648" y="118">NO &#8212; IT NEEDS DOING</text>
  <text class="h" x="648" y="150">The list</text>
  <line x1="648" y1="174" x2="1144" y2="174" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="648" y="208">Renew the insurance</text>
  <text class="time" x="1144" y="208" text-anchor="end">due Friday</text>
  <text class="item" x="648" y="244">Write the report</text>
  <text class="time" x="1144" y="244" text-anchor="end">due the 31st</text>
  <text class="item" x="648" y="280">Reply to Sam</text>
  <text class="time" x="1144" y="280" text-anchor="end">no date</text>
  <text class="item" x="648" y="316">Book a haircut</text>
  <text class="time" x="1144" y="316" text-anchor="end">no date</text>

  <line x1="24" y1="386" x2="1176" y2="386" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="424">The deadline appears twice on purpose: a marker on the 31st, because that is a fact about the</text>
  <text class="foot" x="24" y="450">31st, and a task on the list, because the work has to find its hours somewhere.</text>
</svg>
