<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="kd-title kd-desc">
  <title id="kd-title">The four keyboard shortcuts that carry the value</title>
  <desc id="kd-desc">Command K opens a palette that reaches any note or page by name. Shift Command F searches inside every note. Command N starts a new note immediately. A slash inside the editor reaches every block type without a toolbar. Everything past these four is optimisation.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .k    { font-size: 30px; font-weight: 600; fill: #0e7cc4; }
    .h    { font-size: 22px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 19px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="276" height="300" rx="12"/>
  <text class="k" x="52" y="96">⌘K</text>
  <text class="h" x="52" y="146">Go anywhere</text>
  <text class="note" x="52" y="188">Any note or page,</text>
  <text class="note" x="52" y="214">reached by name.</text>
  <text class="note" x="52" y="266">Navigation collapsed</text>
  <text class="note" x="52" y="292">into typing.</text>

  <rect class="card" x="324" y="30" width="276" height="300" rx="12"/>
  <text class="k" x="352" y="96">⇧⌘F</text>
  <text class="h" x="352" y="146">Find anything</text>
  <text class="note" x="352" y="188">Words inside notes,</text>
  <text class="note" x="352" y="214">not just their names.</text>
  <text class="note" x="352" y="266">A different question</text>
  <text class="note" x="352" y="292">from the one above.</text>

  <rect class="card" x="624" y="30" width="276" height="300" rx="12"/>
  <text class="k" x="652" y="96">⌘N</text>
  <text class="h" x="652" y="146">Start writing</text>
  <text class="note" x="652" y="188">Thought to blinking</text>
  <text class="note" x="652" y="214">cursor, no detour.</text>
  <text class="note" x="652" y="266">The measurement</text>
  <text class="note" x="652" y="292">that matters most.</text>

  <rect class="card" x="924" y="30" width="252" height="300" rx="12"/>
  <text class="k" x="952" y="96">/</text>
  <text class="h" x="952" y="146">Any block</text>
  <text class="note" x="952" y="188">Heading, list, table,</text>
  <text class="note" x="952" y="214">code, callout, image.</text>
  <text class="note" x="952" y="266">Formatting without</text>
  <text class="note" x="952" y="292">a toolbar trip.</text>

  <text class="foot" x="24" y="392">One key a week. Four weeks to keyboard-driven — which is the only schedule that works.</text>
</svg>
