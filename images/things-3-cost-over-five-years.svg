<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Total spend on a to-do app over five years</title>
  <desc id="tc-desc">Total spend for one person at US list prices on 7 November 2026, before tax, held flat. Todoist Pro rises by $60 a year to $300. TickTick Premium rises by $49.99 a year to $249.95. Things 3 stays flat at $79.97 for Mac, iPhone and iPad, and at $49.99 for the Mac alone.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .lbl  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .blue { font-size: 18px; font-weight: 600; fill: #0e7cc4; }
    .ax   { font-size: 17px; fill: #71757e; }
    .grid { stroke: #e6e6e9; stroke-width: 2; }
    .step { fill: none; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="520" rx="12"/>
  <text class="h" x="56" y="66">Total spent on a to-do app over five years, one person</text>
  <text class="note" x="56" y="94">List prices on 7 November 2026, before tax, held flat. Yearly plans bill at the start of each year.</text>

  <line class="grid" x1="110" y1="470" x2="880" y2="470"/>
  <line class="grid" x1="110" y1="356.7" x2="880" y2="356.7"/>
  <line class="grid" x1="110" y1="243.3" x2="880" y2="243.3"/>
  <line class="grid" x1="110" y1="130" x2="880" y2="130"/>
  <text class="ax" x="98" y="476" text-anchor="end">$0</text>
  <text class="ax" x="98" y="363" text-anchor="end">$100</text>
  <text class="ax" x="98" y="249" text-anchor="end">$200</text>
  <text class="ax" x="98" y="136" text-anchor="end">$300</text>

  <text class="ax" x="187" y="504" text-anchor="middle">Year 1</text>
  <text class="ax" x="341" y="504" text-anchor="middle">Year 2</text>
  <text class="ax" x="495" y="504" text-anchor="middle">Year 3</text>
  <text class="ax" x="649" y="504" text-anchor="middle">Year 4</text>
  <text class="ax" x="803" y="504" text-anchor="middle">Year 5</text>

  <path class="step" stroke="#3d3f45" d="M110 402 H264 V334 H418 V266 H572 V198 H726 V130 H880"/>
  <path class="step" stroke="#a3a7af" d="M110 413.3 H264 V356.7 H418 V300 H572 V243.3 H726 V186.7 H880"/>
  <path class="step" stroke="#0e7cc4" d="M110 379.4 H880"/>
  <path class="step" stroke="#0e7cc4" stroke-dasharray="4 10" d="M110 413.3 H880"/>

  <text class="lbl" x="892" y="136">Todoist Pro, $300</text>
  <text class="lbl" x="892" y="193">TickTick Premium, $249.95</text>
  <text class="blue" x="892" y="374">Things 3, Mac, iPhone</text>
  <text class="blue" x="892" y="396">and iPad, $79.97</text>
  <text class="blue" x="892" y="420">Things 3, Mac only, $49.99</text>
</svg>
