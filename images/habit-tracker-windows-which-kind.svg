<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="hw-title hw-desc">
  <title id="hw-title">Which kind of habit tracker to use on Windows</title>
  <desc id="hw-desc">Four situations matched to a habit tracker. On this PC only, and free: OpenHabitTracker or Table Habit from the Microsoft Store. On your PC and your phone: Habitify, or TickTick if you want tasks too. Nothing new to install: an Excel checkbox grid or a repeating task in To Do. Next to your notes and tasks on one PC: Cyanote.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 22px; font-weight: 600; fill: #0a0a0b; }
    .lbl  { font-size: 19px; font-weight: 600; fill: #0a0a0b; }
    .sub  { font-size: 17px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .box  { fill: #f4f4f5; stroke: #e6e6e9; stroke-width: 2; }
    .boxa { fill: #e8f3fb; stroke: #7fbde3; stroke-width: 2; }
    .bar  { fill: #a3a7af; }
    .bara { fill: #0e7cc4; }
    .arr  { stroke: #71757e; stroke-width: 3; fill: none; }
    .head { fill: #71757e; }
    @media (prefers-color-scheme: dark) {
      .h, .lbl { fill: #f4f4f5; }
      .sub { fill: #a4a8b0; }
      .card { fill: #16171a; stroke: #2e3036; }
      .box  { fill: #202226; stroke: #34363c; }
      .boxa { fill: #12293a; stroke: #2f77a8; }
      .bar  { fill: #5d626b; }
      .bara { fill: #3f9fdc; }
      .arr  { stroke: #a4a8b0; }
      .head { fill: #a4a8b0; }
    }
  </style>
  <rect class="card" x="24" y="24" width="1152" height="512" rx="12"/>
  <text class="h" x="52" y="68">Pick by where you will be when you tick the box</text>
  <rect class="boxa" x="52" y="96" width="484" height="90" rx="10"/>
  <text class="lbl" x="72" y="132">At this PC, for free</text>
  <text class="sub" x="72" y="160">no account, works offline</text>
  <path class="arr" d="M540 141 H604"/><polygon class="head" points="604,133 620,141 604,149"/>
  <rect class="boxa" x="624" y="96" width="524" height="90" rx="10"/>
  <text class="lbl" x="644" y="132">OpenHabitTracker or Table Habit</text>
  <text class="sub" x="644" y="160">Microsoft Store, both open source</text>
  <rect class="box" x="52" y="202" width="484" height="90" rx="10"/>
  <text class="lbl" x="72" y="238">At the PC and on your phone</text>
  <text class="sub" x="72" y="266">the record has to follow you</text>
  <path class="arr" d="M540 247 H604"/><polygon class="head" points="604,239 620,247 604,255"/>
  <rect class="box" x="624" y="202" width="524" height="90" rx="10"/>
  <text class="lbl" x="644" y="238">Habitify, or TickTick for tasks too</text>
  <text class="sub" x="644" y="266">free for 3 habits, or for 5</text>
  <rect class="box" x="52" y="308" width="484" height="90" rx="10"/>
  <text class="lbl" x="72" y="344">In tools you already have</text>
  <text class="sub" x="72" y="372">nothing new to install</text>
  <path class="arr" d="M540 353 H604"/><polygon class="head" points="604,345 620,353 604,361"/>
  <rect class="box" x="624" y="308" width="524" height="90" rx="10"/>
  <text class="lbl" x="644" y="344">Excel checkboxes or a To Do repeat</text>
  <text class="sub" x="644" y="372">Microsoft account, no streaks</text>
  <rect class="box" x="52" y="414" width="484" height="90" rx="10"/>
  <text class="lbl" x="72" y="450">Beside your notes and tasks</text>
  <text class="sub" x="72" y="478">one PC, no phone</text>
  <path class="arr" d="M540 459 H604"/><polygon class="head" points="604,451 620,459 604,467"/>
  <rect class="box" x="624" y="414" width="524" height="90" rx="10"/>
  <text class="lbl" x="644" y="450">Cyanote</text>
  <text class="sub" x="644" y="478">$7.99 once, no account, no sync</text>

</svg>
