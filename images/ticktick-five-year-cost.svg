<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t5-title t5-desc">
  <title id="t5-title">What five years of TickTick Premium costs next to the alternatives</title>
  <desc id="t5-desc">Five-year cost for one person at US prices on 23 November 2026, before tax, held flat. TickTick free and Apple Reminders cost $0. Things 3 for Mac and iPhone costs $59.98 once at list price. TickTick Premium costs $249.95 billed yearly or $299.40 billed monthly. Todoist Pro costs $300 billed yearly or $420 billed monthly.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .lbl  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .val  { font-size: 17px; fill: #3d3f45; }
    .grid { stroke: #e6e6e9; stroke-width: 2; }
    .a { fill: #a3a7af; } .b { fill: #3d3f45; } .c { fill: #0e7cc4; }
    @media (prefers-color-scheme: dark) {
      .h { fill: #f4f4f5; }
      .note { fill: #a4a8b0; }
      .lbl, .val { fill: #d4d6db; }
      .card { fill: #16171a; stroke: #2e3036; }
      .grid { stroke: #34363c; }
      .b { fill: #8b9099; } .c { fill: #3f9edb; }
    }
  </style>
  <rect class="card" x="24" y="20" width="1152" height="460" rx="12"/>
  <text class="h" x="56" y="66">Five years of a to-do app, one person</text>
  <text class="note" x="56" y="94">US list prices on 23 November 2026, before tax, held flat.</text>
  <line class="grid" x1="400" y1="122" x2="400" y2="452"/>

  <text class="lbl" x="380" y="154" text-anchor="end">TickTick free, Apple Reminders</text>
  <rect class="a" x="400" y="134" width="4" height="28" rx="4"/>
  <text class="val" x="418" y="154">$0</text>

  <text class="lbl" x="380" y="208" text-anchor="end">Things 3, Mac and iPhone</text>
  <rect class="b" x="400" y="188" width="68.5" height="28" rx="4"/>
  <text class="val" x="482.5" y="208">$59.98, paid once</text>

  <text class="lbl" x="380" y="262" text-anchor="end">TickTick Premium, yearly</text>
  <rect class="c" x="400" y="242" width="285.7" height="28" rx="4"/>
  <text class="val" x="699.7" y="262">$249.95 ($49.99 a year)</text>

  <text class="lbl" x="380" y="316" text-anchor="end">TickTick Premium, monthly</text>
  <rect class="c" x="400" y="296" width="342.2" height="28" rx="4"/>
  <text class="val" x="756.2" y="316">$299.40 ($4.99 a month)</text>

  <text class="lbl" x="380" y="370" text-anchor="end">Todoist Pro, yearly</text>
  <rect class="b" x="400" y="350" width="342.9" height="28" rx="4"/>
  <text class="val" x="756.9" y="370">$300 ($60 a year)</text>

  <text class="lbl" x="380" y="424" text-anchor="end">Todoist Pro, monthly</text>
  <rect class="b" x="400" y="404" width="480.0" height="28" rx="4"/>
  <text class="val" x="894.0" y="424">$420 ($7 a month)</text>

</svg>
