<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="ns-title ns-desc">
  <title id="ns-title">Five places a note can stop between a phone and a Mac</title>
  <desc id="ns-desc">A note can never leave the phone because it was written into a local On My iPhone account. It can fail to be sent because Notes is switched off in iCloud or the storage is full. It can still be in transit because Apple's own side is slow or down. It can be sent to a different Apple Account than the one the Mac is signed in to. Or it can arrive and sit in a folder, an account or a locked note you are not looking at.</desc>
  <style>
    .h  { font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0a0a0b; }
    .s  { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #71757e; }
    .cd { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0a0a0b; }
    .cs { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #71757e; }
    .hd { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0a0a0b; }
    .b  { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3d3f45; }
    .n  { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
  </style>

  <text class="h" x="40" y="42">Five places a note can stop</text>
  <text class="s" x="40" y="74">Between the phone you wrote it on and the Mac you are looking at.</text>

  <!-- the pipeline -->
  <rect class="card" x="40" y="104" width="200" height="90" rx="14"/>
  <text class="cd" x="140" y="144" text-anchor="middle">iPhone</text>
  <text class="cs" x="140" y="172" text-anchor="middle">where you wrote it</text>

  <rect class="card" x="500" y="104" width="200" height="90" rx="14"/>
  <rect x="500" y="104" width="200" height="8" rx="4" fill="#0e7cc4"/>
  <text class="cd" x="600" y="148" text-anchor="middle">iCloud</text>
  <text class="cs" x="600" y="176" text-anchor="middle">the bit in between</text>

  <rect class="card" x="960" y="104" width="200" height="90" rx="14"/>
  <text class="cd" x="1060" y="144" text-anchor="middle">Mac</text>
  <text class="cs" x="1060" y="172" text-anchor="middle">where you are looking</text>

  <!-- hop one -->
  <line x1="252" y1="149" x2="478" y2="149" stroke="#d8dade" stroke-width="3"/>
  <path d="M478 141 L494 149 L478 157 Z" fill="#d8dade"/>
  <circle cx="370" cy="149" r="15" fill="#ffffff" stroke="#e6e6e9" stroke-width="2"/>
  <path d="M363 142 L377 156 M377 142 L363 156" stroke="#b8bcc4" stroke-width="3" stroke-linecap="round"/>

  <!-- hop two -->
  <line x1="712" y1="149" x2="938" y2="149" stroke="#d8dade" stroke-width="3"/>
  <path d="M938 141 L954 149 L938 157 Z" fill="#d8dade"/>
  <circle cx="830" cy="149" r="15" fill="#ffffff" stroke="#e6e6e9" stroke-width="2"/>
  <path d="M823 142 L837 156 M837 142 L823 156" stroke="#b8bcc4" stroke-width="3" stroke-linecap="round"/>

  <!-- 1 -->
  <circle cx="55" cy="222" r="15" fill="#0e7cc4"/>
  <text class="n" x="55" y="229" text-anchor="middle">1</text>
  <text class="hd" x="40" y="272">Never left</text>
  <line x1="40" y1="288" x2="240" y2="288" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="40" y="320">Written into the local</text>
  <text class="b" x="40" y="346">On My iPhone account.</text>
  <text class="b" x="40" y="372">Nothing says so.</text>

  <!-- 2 -->
  <circle cx="285" cy="222" r="15" fill="#0e7cc4"/>
  <text class="n" x="285" y="229" text-anchor="middle">2</text>
  <text class="hd" x="270" y="272">Never sent</text>
  <line x1="270" y1="288" x2="470" y2="288" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="270" y="320">Notes switched off in</text>
  <text class="b" x="270" y="346">iCloud on that device,</text>
  <text class="b" x="270" y="372">or the storage is full.</text>

  <!-- 3 -->
  <circle cx="515" cy="222" r="15" fill="#0e7cc4"/>
  <text class="n" x="515" y="229" text-anchor="middle">3</text>
  <text class="hd" x="500" y="272">Still in transit</text>
  <line x1="500" y1="288" x2="700" y2="288" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="500" y="320">Apple is having a bad</text>
  <text class="b" x="500" y="346">day, or it is simply</text>
  <text class="b" x="500" y="372">taking its time.</text>

  <!-- 4 -->
  <circle cx="745" cy="222" r="15" fill="#0e7cc4"/>
  <text class="n" x="745" y="229" text-anchor="middle">4</text>
  <text class="hd" x="730" y="272">Sent elsewhere</text>
  <line x1="730" y1="288" x2="930" y2="288" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="730" y="320">The Mac is signed in</text>
  <text class="b" x="730" y="346">to a different Apple</text>
  <text class="b" x="730" y="372">Account.</text>

  <!-- 5 -->
  <circle cx="975" cy="222" r="15" fill="#0e7cc4"/>
  <text class="n" x="975" y="229" text-anchor="middle">5</text>
  <text class="hd" x="960" y="272">Arrived, unseen</text>
  <line x1="960" y1="288" x2="1160" y2="288" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="960" y="320">Sitting in a folder,</text>
  <text class="b" x="960" y="346">an account or a locked</text>
  <text class="b" x="960" y="372">note you are not in.</text>

  <text class="s" x="40" y="432" fill="#0e7cc4">Only the middle one is Apple&#8217;s fault. The other four are settings, and none of them announce themselves.</text>
</svg>
