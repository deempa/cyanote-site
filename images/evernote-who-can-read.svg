<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-labelledby="ew-title ew-desc">
  <title id="ew-title">Who can read a private Evernote note, and when</title>
  <desc id="ew-desc">Five parties who can reach a private Evernote note. Other Evernote users cannot, unless you share it. Evernote staff can only with your permission, such as for a support request, or when needed to meet a legal obligation. OpenAI processes notes when you use AI Assistant or meeting summaries, and Evernote says it deletes them after answering; the AI features are on by default and can be turned off. Courts and police can obtain content with a valid, legally binding order, which you cannot switch off because Evernote's keys are Google-managed. Outside assistants such as Claude or ChatGPT can read notes only if you connect them, under their own terms.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .row  { fill: #f6f7f9; }
    .h    { font-size: 26px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .ch   { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .rl   { font-size: 20px; font-weight: 600; fill: #0a0a0b; }
    .ok   { font-size: 18px; font-weight: 600; fill: #0e7cc4; }
    .no   { font-size: 18px; font-weight: 600; fill: #b4441f; }
    .mid  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .d    { font-size: 15px; fill: #71757e; }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="624" rx="12"/>
  <text class="h" x="56" y="66">Who can reach a private Evernote note?</text>
  <text class="note" x="56" y="94">From Evernote's privacy policy, security overview and AI FAQ, checked 17 October 2026.</text>

  <text class="ch" x="80" y="146">Who</text>
  <text class="ch" x="420" y="146">Can they?</text>
  <text class="ch" x="760" y="146">What you control</text>

  <rect class="row" x="56" y="166" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="212">Other Evernote users</text>
  <text class="ok" x="420" y="202">No</text>
  <text class="d" x="420" y="226">unless you share the note</text>
  <text class="mid" x="760" y="202">Fully yours</text>
  <text class="d" x="760" y="226">sharing decides</text>

  <rect class="row" x="56" y="258" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="304">Evernote staff</text>
  <text class="mid" x="420" y="294">Only with your permission</text>
  <text class="d" x="420" y="318">or to meet a legal obligation</text>
  <text class="mid" x="760" y="294">Whether you say yes</text>
  <text class="d" x="760" y="318">support access ends when the issue does</text>

  <rect class="row" x="56" y="350" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="388">OpenAI</text>
  <text class="d" x="80" y="412">via Evernote's AI features</text>
  <text class="mid" x="420" y="388">When you use AI Assistant</text>
  <text class="d" x="420" y="412">or meeting summaries; deleted after</text>
  <text class="mid" x="760" y="388">AI features toggle</text>
  <text class="d" x="760" y="412">on by default, no training</text>

  <rect class="row" x="56" y="442" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="488">Courts and police</text>
  <text class="no" x="420" y="478">Yes, with an order</text>
  <text class="d" x="420" y="502">valid and legally binding</text>
  <text class="no" x="760" y="478">Nothing</text>
  <text class="d" x="760" y="502">keys are Google-managed</text>

  <rect class="row" x="56" y="534" width="1088" height="80" rx="10"/>
  <text class="rl" x="80" y="572">Connected assistants</text>
  <text class="d" x="80" y="596">such as Claude or ChatGPT</text>
  <text class="mid" x="420" y="572">Only if you connect them</text>
  <text class="d" x="420" y="596">under their own terms</text>
  <text class="mid" x="760" y="572">Whether you connect one</text>
  <text class="d" x="760" y="596">Evernote doesn't control them</text>
</svg>
