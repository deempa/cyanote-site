<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="se-title se-desc">
  <title id="se-title">Four swallowed failures and what each one cost</title>
  <desc id="se-desc">A template save whose failed write was caught and ignored still fired a change notification, so the user was shown a success message with no template behind it. A paste keystroke discarded the error text of the process it spawned, leaving the worst failure with no evidence. A focus session failed silently because a quiet-by-default wrapper ate the rejection. And a polling loop that rescheduled itself only on success ended outright on one rejection, stopping clipboard history for the rest of the session.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 19px; font-weight: 600; fill: #0a0a0b; }
    .said { font-size: 17px; fill: #3d3f45; }
    .cost { font-size: 17px; font-weight: 600; fill: #b3392c; }
    .note { font-size: 15px; fill: #71757e; }
    .lbl  { font-size: 14px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="278" height="286" rx="12"/>
  <text class="h" x="52" y="70">The save</text>
  <text class="lbl" x="52" y="102">THE USER SAW</text>
  <text class="said" x="52" y="128">&#8220;Saved&#8221;</text>
  <line x1="52" y1="152" x2="274" y2="152" stroke="#e6e6e9" stroke-width="2"/>
  <text class="lbl" x="52" y="182">WHAT EXISTED</text>
  <text class="cost" x="52" y="208">No template</text>
  <text class="note" x="52" y="248">The write failed, the catch</text>
  <text class="note" x="52" y="270">ate it, the notification</text>
  <text class="note" x="52" y="292">fired anyway.</text>

  <rect class="card" x="318" y="30" width="278" height="286" rx="12"/>
  <text class="h" x="346" y="70">The paste</text>
  <text class="lbl" x="346" y="102">THE USER SAW</text>
  <text class="said" x="346" y="128">Nothing at all</text>
  <line x1="346" y1="152" x2="568" y2="152" stroke="#e6e6e9" stroke-width="2"/>
  <text class="lbl" x="346" y="182">WHAT WAS LOST</text>
  <text class="cost" x="346" y="208">Every error message</text>
  <text class="note" x="346" y="248">Permission revoked, event</text>
  <text class="note" x="346" y="270">refused &#8212; each prints a</text>
  <text class="note" x="346" y="292">sentence. All discarded.</text>

  <rect class="card" x="612" y="30" width="278" height="286" rx="12"/>
  <text class="h" x="640" y="70">The focus session</text>
  <text class="lbl" x="640" y="102">THE USER SAW</text>
  <text class="said" x="640" y="128">A button doing nothing</text>
  <line x1="640" y1="152" x2="862" y2="152" stroke="#e6e6e9" stroke-width="2"/>
  <text class="lbl" x="640" y="182">WHAT HAPPENED</text>
  <text class="cost" x="640" y="208">Command not exported</text>
  <text class="note" x="640" y="248">A wrapper named &#8220;quiet&#8221;</text>
  <text class="note" x="640" y="270">ate the rejection, as it</text>
  <text class="note" x="640" y="292">had been asked to.</text>

  <rect class="card" x="906" y="30" width="270" height="286" rx="12"/>
  <text class="h" x="934" y="70">The poll</text>
  <text class="lbl" x="934" y="102">THE USER SAW</text>
  <text class="said" x="934" y="128">History just stopped</text>
  <line x1="934" y1="152" x2="1148" y2="152" stroke="#e6e6e9" stroke-width="2"/>
  <text class="lbl" x="934" y="182">WHAT IT COST</text>
  <text class="cost" x="934" y="208">The whole session</text>
  <text class="note" x="934" y="248">Rescheduled on success</text>
  <text class="note" x="934" y="270">only, so one rejection</text>
  <text class="note" x="934" y="292">retired the feature.</text>

  <line x1="24" y1="356" x2="1176" y2="356" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="394">Three questions for any catch block: does the user believe something happened, can they do</text>
  <text class="foot" x="24" y="424">anything about it, and what does this failure cost if it repeats &#8212; one item, or the feature?</text>
  <text class="foot" x="24" y="456" font-weight="600" fill="#0a0a0b">And &#8220;it did not throw&#8221; is not the same claim as &#8220;the value is there&#8221;. Read it back.</text>
</svg>
