<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="pl-title pl-desc">
  <title id="pl-title">Three layers of protection on a Mac, and what each one stops</title>
  <desc id="pl-desc">FileVault protects a Mac that is powered off. The screen lock protects a Mac that is on but unattended. A locked note protects a single note from anyone already using your unlocked Mac. The three are not alternatives; each covers a case the others leave open.</desc>
  <style>
    .h  { font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0a0a0b; }
    .lb { font: 600 25px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0a0a0b; }
    .s  { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #71757e; }
    .b  { font: 400 23px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3d3f45; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
  </style>

  <text class="h" x="40" y="44">Three layers, three different intruders</text>
  <text class="s" x="40" y="78">They stack. None of them replaces another.</text>

  <!-- row 1 -->
  <rect class="card" x="40" y="110" width="1120" height="104" rx="12"/>
  <rect x="40" y="110" width="8" height="104" rx="4" fill="#0e7cc4"/>
  <text class="lb" x="76" y="152">FileVault</text>
  <text class="s" x="76" y="186">full-disk encryption</text>
  <line x1="470" y1="128" x2="470" y2="196" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="504" y="152">Stops someone holding a Mac that is switched off</text>
  <text class="s" x="504" y="186">a thief, a lost laptop, a machine sent for repair</text>

  <!-- row 2 -->
  <rect class="card" x="40" y="230" width="1120" height="104" rx="12"/>
  <rect x="40" y="230" width="8" height="104" rx="4" fill="#4fa3d8"/>
  <text class="lb" x="76" y="272">Screen lock</text>
  <text class="s" x="76" y="306">your login password</text>
  <line x1="470" y1="248" x2="470" y2="316" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="504" y="272">Stops someone at a Mac that is on but unattended</text>
  <text class="s" x="504" y="306">the case FileVault does nothing about</text>

  <!-- row 3 -->
  <rect class="card" x="40" y="350" width="1120" height="104" rx="12"/>
  <rect x="40" y="350" width="8" height="104" rx="4" fill="#8ec6e8"/>
  <text class="lb" x="76" y="392">A locked note</text>
  <text class="s" x="76" y="426">per-note password</text>
  <line x1="470" y1="368" x2="470" y2="436" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="504" y="392">Stops someone already using your unlocked Mac</text>
  <text class="s" x="504" y="426">a shared screen, a borrowed laptop, a shoulder</text>
</svg>
