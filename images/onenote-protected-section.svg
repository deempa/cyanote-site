<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="op-title op-desc">
  <title id="op-title">What a password-protected OneNote section hides and what it doesn't</title>
  <desc id="op-desc">A locked section hides every page in it, keeps them out of notebook search, and keeps the contents from anyone without the password, including Microsoft support. It doesn't cover audio and video recordings, a single page or a whole notebook at once, the section's name, or a section you've unlocked until it times out. Microsoft doesn't document how attached files or Copilot are handled.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .row  { fill: #f6f7f9; }
    .h    { font-size: 26px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .ch   { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .rl   { font-size: 20px; font-weight: 600; fill: #0a0a0b; }
    .i    { font-size: 18px; fill: #0a0a0b; }
    .ok   { font-size: 18px; font-weight: 600; fill: #0e7cc4; }
    .no   { font-size: 18px; font-weight: 600; fill: #b4441f; }
    .mid  { font-size: 18px; font-weight: 600; fill: #3d3f45; }
    .d    { font-size: 15px; fill: #71757e; }
    @media (prefers-color-scheme: dark) {
      .h, .rl, .i { fill: #f4f4f5; }
      .note, .d { fill: #a4a8b0; }
      .ch, .mid { fill: #d4d6db; }
      .ok { fill: #6db8ea; }
      .no { fill: #f0906c; }
      .card { fill: #16171a; stroke: #2e3036; }
      .row  { fill: #202226; }
    }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="460" rx="12"/>
  <text class="h" x="56" y="66">What a password-protected section hides</text>
  <text class="note" x="56" y="94">From Microsoft's OneNote help pages for Windows, Mac, iPhone and the web, checked 23 November 2026.</text>
  <rect class="row" x="56" y="122" width="532" height="280" rx="10"/>
  <text class="ok" x="84" y="162">Hidden while it's locked</text>
  <rect class="row" x="612" y="122" width="532" height="280" rx="10"/>
  <text class="no" x="640" y="162">Not covered</text>
  <text class="i" x="84" y="208">Every page in that section</text>
  <text class="i" x="640" y="208">Audio and video recordings</text>
  <text class="i" x="84" y="248">Those pages, from notebook search</text>
  <text class="i" x="640" y="248">A single page, or a whole notebook at once</text>
  <text class="i" x="84" y="288">The contents, from anyone without the password</text>
  <text class="i" x="640" y="288">The section's name</text>
  <text class="i" x="84" y="328">The contents, from Microsoft support</text>
  <text class="i" x="640" y="328">A section you've unlocked, until it times out</text>
  <text class="d" x="84" y="378">Forget the password and nobody can get it back.</text>
  <text class="d" x="640" y="378">Attached files and Copilot: Microsoft's pages don't say.</text>
  <text class="note" x="56" y="446">You can set the password on Windows, a Mac, iPhone or iPad. The web version can only unlock.</text>
</svg>
