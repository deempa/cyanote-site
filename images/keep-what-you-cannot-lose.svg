<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="kw-title kw-desc">
  <title id="kw-title">Splitting the map from the secrets</title>
  <desc id="kw-desc">The map — which accounts exist, where documents are, which institutions hold what, which licences you bought, who to contact, and where the recovery codes physically are — can live in your notes, because none of it grants access to anything. The secrets that do grant access belong elsewhere: most in a password manager, and the recovery codes for your email and the password manager itself on paper, because those two are the roots everything else recovers through.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 21px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 18px; fill: #3d3f45; }
    .lbl  { font-size: 15px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
    .note { font-size: 16px; fill: #71757e; }
    .warn { font-size: 17px; font-weight: 600; fill: #b3392c; }
  </style>

  <rect class="card" x="24" y="30" width="560" height="322" rx="12"/>
  <rect x="24" y="30" width="560" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl" x="56" y="72">THE MAP &#8212; SAFE IN YOUR NOTES</text>
  <text class="h" x="56" y="106">Grants access to nothing</text>
  <line x1="56" y1="130" x2="552" y2="130" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="56" y="166">Which accounts exist, under which email</text>
  <text class="item" x="56" y="200">Which documents, and where the originals are</text>
  <text class="item" x="56" y="234">Which bank, which pension, which insurer</text>
  <text class="item" x="56" y="268">Licences bought, and the receipt&#8217;s address</text>
  <text class="item" x="56" y="302">Solicitor, accountant, next of kin</text>
  <text class="note" x="56" y="336">And a sentence saying where the codes physically are.</text>

  <rect class="card" x="616" y="30" width="560" height="322" rx="12"/>
  <rect x="616" y="30" width="560" height="7" rx="3.5" fill="#b3392c"/>
  <text class="lbl" x="648" y="72">THE SECRETS &#8212; SOMEWHERE ELSE</text>
  <text class="h" x="648" y="106">Everything that grants access</text>
  <line x1="648" y1="130" x2="1144" y2="130" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="648" y="166">Passwords</text>
  <text class="note" x="1144" y="166" text-anchor="end">password manager</text>
  <text class="item" x="648" y="204">Most recovery codes</text>
  <text class="note" x="1144" y="204" text-anchor="end">password manager</text>
  <text class="item" x="648" y="242">Codes for your email</text>
  <text class="warn" x="1144" y="242" text-anchor="end">paper</text>
  <text class="item" x="648" y="280">Codes for the manager itself</text>
  <text class="warn" x="1144" y="280" text-anchor="end">paper</text>
  <text class="note" x="648" y="322">Those two are the roots. Keys inside the car, otherwise.</text>

  <line x1="24" y1="392" x2="1176" y2="392" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="430">Three copies, two kinds of place, one you have actually opened &#8212; and one person who knows</text>
  <text class="foot" x="24" y="458">the map exists and where to find it, without knowing what is in it.</text>
</svg>
