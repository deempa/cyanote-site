<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="td-title td-desc">
  <title id="td-title">What one $10 sale covers, and what it does not</title>
  <desc id="td-desc">A $10 sale nets about $9 after the payment processor's 5% plus 50 cents. The fixed yearly costs are about $111 — the $99 Apple Developer Program plus a domain, with hosting near zero — which is roughly thirteen copies a year to stand still. The third column is the part the price does not scale with: free updates for life, across a macOS release every autumn, over 36,000 lines of TypeScript and 3,500 lines of Rust.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .big  { font-size: 34px; font-weight: 600; fill: #0e7cc4; }
    .item { font-size: 19px; fill: #3d3f45; }
    .gone { font-size: 19px; fill: #a3a7af; }
    .note { font-size: 18px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="360" height="360" rx="12"/>
  <rect x="24" y="30" width="360" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="54" y="88">One sale</text>
  <text class="note" x="54" y="118">Paid once, no renewal</text>
  <line x1="54" y1="146" x2="354" y2="146" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="54" y="186">List price</text>
  <text class="item" x="300" y="186" text-anchor="end">$10.00</text>
  <text class="gone" x="54" y="222">Processor, 5% + 50&#162;</text>
  <text class="gone" x="300" y="222" text-anchor="end">&#8722;$1.00</text>
  <line x1="54" y1="248" x2="300" y2="248" stroke="#e6e6e9" stroke-width="2"/>
  <text class="big" x="54" y="296">$9</text>
  <text class="note" x="54" y="330">Lands, per copy</text>
  <text class="note" x="54" y="366">Sales tax handled by the</text>
  <text class="note" x="54" y="386">merchant of record</text>

  <rect class="card" x="414" y="30" width="360" height="360" rx="12"/>
  <rect x="414" y="30" width="360" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="444" y="88">Every year, regardless</text>
  <text class="note" x="444" y="118">Whether it sells or not</text>
  <line x1="444" y1="146" x2="744" y2="146" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="444" y="186">Apple Developer</text>
  <text class="item" x="744" y="186" text-anchor="end">$99</text>
  <text class="item" x="444" y="222">Domain</text>
  <text class="item" x="744" y="222" text-anchor="end">$12</text>
  <text class="item" x="444" y="258">Hosting &#8212; static, free tier</text>
  <text class="item" x="744" y="258" text-anchor="end">$0</text>
  <line x1="444" y1="284" x2="744" y2="284" stroke="#e6e6e9" stroke-width="2"/>
  <text class="big" x="444" y="332">$111</text>
  <text class="note" x="444" y="366">About 13 copies a year,</text>
  <text class="note" x="444" y="386">to stand still</text>

  <rect class="card" x="804" y="30" width="372" height="360" rx="12"/>
  <rect x="804" y="30" width="372" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="834" y="88">No ceiling</text>
  <text class="note" x="834" y="118">What the price cannot scale with</text>
  <line x1="834" y1="146" x2="1146" y2="146" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="834" y="186">Free updates, for life</text>
  <text class="item" x="834" y="222">A macOS release every autumn</text>
  <text class="item" x="834" y="258">36,000 lines of TypeScript</text>
  <text class="item" x="834" y="294">3,500 lines of Rust</text>
  <text class="item" x="834" y="330">A webview Apple ships</text>
  <text class="note" x="834" y="378">Flat forever. Revenue is not.</text>

  <text class="foot" x="24" y="446">The cash side is small enough to ignore. The obligation is the half with no ceiling &#8212; and it is what the architecture had to answer.</text>
</svg>
