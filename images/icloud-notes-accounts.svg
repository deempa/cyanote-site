<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="ica-title ica-desc">
  <title id="ica-title">One Notes app, several accounts, and where each note actually goes</title>
  <desc id="ica-desc">Notes on a Mac can hold more than one account at once. A note in the iCloud account is on Apple's servers and on every signed-in device. A note in the On My Mac account is on that Mac only and syncs nowhere. A note in a Gmail, Yahoo or Exchange account lives on that mail server. Every note belongs to exactly one of them.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h     { font-size: 28px; font-weight: 600; fill: #0a0a0b; }
    .name  { font-size: 25px; font-weight: 600; fill: #0a0a0b; }
    .ghost-name { font-size: 25px; font-weight: 600; fill: #8b9099; }
    .s     { font-size: 22px; fill: #71757e; }
    .b     { font-size: 23px; fill: #3d3f45; }
    .chip  { font-size: 21px; fill: #0e7cc4; }
    .chip-off { font-size: 21px; fill: #8b9099; }
    .card  { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .card-off { fill: #ffffff; stroke: #d3d6dc; stroke-width: 2; stroke-dasharray: 6 6; }
    .box   { fill: #fafafa; stroke: #e6e6e9; stroke-width: 1.5; }
    .box-off { fill: #fafafa; stroke: #d3d6dc; stroke-width: 1.5; stroke-dasharray: 6 6; }
  </style>

  <text class="h" x="40" y="44">One Notes app, three accounts, three destinations</text>
  <text class="s" x="40" y="78">Every note belongs to exactly one of these, and the sidebar is the only place that says which.</text>

  <!-- iCloud -->
  <rect class="card" x="40" y="112" width="356" height="196" rx="14"/>
  <rect x="72" y="142" width="34" height="34" rx="9" fill="#0e7cc4"/>
  <text class="name" x="120" y="168">iCloud</text>
  <text class="s" x="72" y="212">signed in to your Apple Account</text>
  <line x1="72" y1="234" x2="364" y2="234" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="72" y="270">On Apple's servers, and on</text>
  <text class="b" x="72" y="296">every signed-in device.</text>

  <line x1="218" y1="308" x2="218" y2="344" stroke="#0e7cc4" stroke-width="2.5"/>
  <polygon points="218,352 210,336 226,336" fill="#0e7cc4"/>
  <rect class="box" x="78" y="358" width="280" height="46" rx="10"/>
  <text class="chip" x="218" y="387" text-anchor="middle">iPhone, iPad, iCloud.com</text>

  <!-- On My Mac -->
  <rect class="card-off" x="422" y="112" width="356" height="196" rx="14"/>
  <rect x="454" y="142" width="34" height="34" rx="9" fill="#ffffff" stroke="#b0b4bb" stroke-width="2"/>
  <text class="ghost-name" x="502" y="168">On My Mac</text>
  <text class="s" x="454" y="212">off until you switch it on</text>
  <line x1="454" y1="234" x2="746" y2="234" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="454" y="270">On this Mac and nowhere</text>
  <text class="b" x="454" y="296">else. Nothing syncs it.</text>

  <line x1="600" y1="308" x2="600" y2="348" stroke="#d3d6dc" stroke-width="2.5" stroke-dasharray="6 6"/>
  <rect class="box-off" x="460" y="358" width="280" height="46" rx="10"/>
  <text class="chip-off" x="600" y="387" text-anchor="middle">nowhere — this Mac only</text>

  <!-- Mail account -->
  <rect class="card" x="804" y="112" width="356" height="196" rx="14"/>
  <rect x="836" y="142" width="34" height="34" rx="9" fill="#ffffff" stroke="#0e7cc4" stroke-width="2"/>
  <text class="name" x="884" y="168">Gmail, Exchange</text>
  <text class="s" x="836" y="212">a mail account that carries notes</text>
  <line x1="836" y1="234" x2="1128" y2="234" stroke="#efeff1" stroke-width="2"/>
  <text class="b" x="836" y="270">On that mail server, in a</text>
  <text class="b" x="836" y="296">Notes folder beside the mail.</text>

  <line x1="982" y1="308" x2="982" y2="344" stroke="#0e7cc4" stroke-width="2.5"/>
  <polygon points="982,352 974,336 990,336" fill="#0e7cc4"/>
  <rect class="box" x="842" y="358" width="280" height="46" rx="10"/>
  <text class="chip" x="982" y="387" text-anchor="middle">your mail provider</text>

  <text class="s" x="40" y="446" fill="#0e7cc4">Most of "where did my notes go" is a note sitting in a different account from the one you are looking in.</text>
</svg>
