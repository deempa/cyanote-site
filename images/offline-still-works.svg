<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="off-title off-desc">
  <title id="off-title">What survives when the network does not</title>
  <desc id="off-desc">In an offline-tolerant app the server holds the truth and the machine holds a cache, so old notes, full-text search and attachments go missing when the connection does. In a local-first app the database on disk is the truth, so notes, search, tasks, calendar, habits and clipboard history all keep working and nothing announces that anything changed.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 25px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 21px; fill: #3d3f45; }
    .gone { font-size: 21px; fill: #a3a7af; }
    .note { font-size: 20px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <!-- cache side -->
  <rect class="card" x="30" y="30" width="545" height="360" rx="14"/>
  <rect x="30" y="30" width="545" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="64" y="86">The disk holds a cache</text>
  <text class="note" x="64" y="118">The truth is on a server you cannot reach</text>

  <text class="item" x="64" y="176">✓  The notes you opened this week</text>
  <text class="gone" x="64" y="220">✕  The note from March</text>
  <text class="gone" x="64" y="264">✕  Search inside note bodies</text>
  <text class="gone" x="64" y="308">✕  Images and attachments</text>
  <text class="gone" x="64" y="352">✕  Anything not visited recently</text>

  <!-- local-first side -->
  <rect class="card" x="625" y="30" width="545" height="360" rx="14"/>
  <rect x="625" y="30" width="545" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="659" y="86">The disk holds the truth</text>
  <text class="note" x="659" y="118">There is no other copy to be cut off from</text>

  <text class="item" x="659" y="176">✓  Every note, from every year</text>
  <text class="item" x="659" y="220">✓  Full-text search across all of it</text>
  <text class="item" x="659" y="264">✓  Tasks, board, calendar, habits</text>
  <text class="item" x="659" y="308">✓  Clipboard history and images</text>
  <text class="item" x="659" y="352">✓  Writing that is still there tomorrow</text>

  <text class="foot" x="30" y="438">Both look identical on a good connection. That is the whole problem.</text>
</svg>
