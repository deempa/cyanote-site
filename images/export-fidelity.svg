<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="ef-title ef-desc">
  <title id="ef-title">What survives an export of your notes, and what does not</title>
  <desc id="ef-desc">Text, headings, bold and italic, lists, quotes and code blocks travel intact between apps. Links between notes, images, checkbox state, tables, highlights and callouts, and created and modified dates are where apps quietly differ and where you should check. Version history, comments, the search index, sharing state and the position of a note in a hierarchy have nowhere to go in a text format at all.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 21px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 17px; fill: #3d3f45; }
    .note { font-size: 16px; fill: #71757e; }
    .lbl  { font-size: 15px; font-weight: 600; letter-spacing: .05em; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="30" width="368" height="330" rx="12"/>
  <rect x="24" y="30" width="368" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl" x="56" y="74" fill="#0e7cc4">TRAVELS INTACT</text>
  <text class="h" x="56" y="108">Nothing to check</text>
  <text class="item" x="56" y="150">Text, headings</text>
  <text class="item" x="56" y="180">Bold, italic, code</text>
  <text class="item" x="56" y="210">Lists and quotes</text>
  <text class="item" x="56" y="240">Code blocks</text>
  <line x1="56" y1="268" x2="360" y2="268" stroke="#e6e6e9" stroke-width="2"/>
  <text class="note" x="56" y="298">Watch only for list indentation</text>
  <text class="note" x="56" y="322">and escaping of literal * and [.</text>

  <rect class="card" x="416" y="30" width="368" height="330" rx="12"/>
  <rect x="416" y="30" width="368" height="7" rx="3.5" fill="#e0a63c"/>
  <text class="lbl" x="448" y="74" fill="#8a6216">NEEDS A DECISION</text>
  <text class="h" x="448" y="108">Where apps differ</text>
  <text class="item" x="448" y="150">Links between notes</text>
  <text class="item" x="448" y="180">Images &#8212; file or reference</text>
  <text class="item" x="448" y="210">Checkbox state</text>
  <text class="item" x="448" y="240">Tables, highlights, callouts</text>
  <text class="item" x="448" y="270">Created and modified dates</text>
  <line x1="448" y1="298" x2="752" y2="298" stroke="#e6e6e9" stroke-width="2"/>
  <text class="note" x="448" y="328">This is the tier worth testing.</text>

  <rect class="card" x="808" y="30" width="368" height="330" rx="12"/>
  <rect x="808" y="30" width="368" height="7" rx="3.5" fill="#a3a7af"/>
  <text class="lbl" x="840" y="74" fill="#71757e">CANNOT CROSS</text>
  <text class="h" x="840" y="108">Nowhere to go</text>
  <text class="item" x="840" y="150">Version history</text>
  <text class="item" x="840" y="180">Comments</text>
  <text class="item" x="840" y="210">The search index</text>
  <text class="item" x="840" y="240">Sharing state</text>
  <text class="item" x="840" y="270">A board&#8217;s column order</text>
  <line x1="840" y1="298" x2="1144" y2="298" stroke="#e6e6e9" stroke-width="2"/>
  <text class="note" x="840" y="328">Relationships, not content.</text>

  <line x1="24" y1="396" x2="1176" y2="396" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="434">Export your most complicated note, open it in a plain text editor, and read it. Fifteen minutes,</text>
  <text class="foot" x="24" y="460">on a day when you are not angry, tells you how portable your notes actually are.</text>
</svg>
