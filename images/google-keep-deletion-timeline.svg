<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="gd-title gd-desc">
  <title id="gd-title">How long a deleted Google Keep note lasts</title>
  <desc id="gd-desc">A timeline in three stages. A deleted Keep note first sits in Keep's trash for seven days, and emptying the trash ends this stage early. Once it is deleted for good, Google's active systems generally finish removing it about two months later, including a recovery window of up to a month. Encrypted backups can hold deleted data for up to six months.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .h    { font-size: 26px; font-weight: 600; fill: #0a0a0b; }
    .note { font-size: 17px; fill: #71757e; }
    .axis { stroke: #c9cbd1; stroke-width: 2; }
    .tick { stroke: #c9cbd1; stroke-width: 2; }
    .tl   { font-size: 15px; fill: #71757e; }
    .b1   { fill: #0e7cc4; }
    .b2   { fill: #6aa9d6; }
    .b3   { fill: #c7dbea; }
    .rl   { font-size: 19px; font-weight: 600; fill: #0a0a0b; }
    .d    { font-size: 15px; fill: #71757e; }
  </style>

  <rect class="card" x="24" y="20" width="1152" height="420" rx="12"/>
  <text class="h" x="56" y="66">How long a deleted Keep note lasts</text>
  <text class="note" x="56" y="94">From Keep's help centre and Google's data retention page, checked 31 October 2026.</text>

  <!-- scale: 0 to 6 months across x=320..1120 (800px), ~133px per month -->
  <text class="rl" x="56" y="160">In Keep's trash</text>
  <text class="d" x="56" y="184">you can restore it</text>
  <rect class="b1" x="289" y="146" width="31" height="36" rx="6"/>
  <text class="d" x="336" y="170">first, 7 days, or until you empty the trash</text>

  <text class="rl" x="56" y="240">Active systems</text>
  <text class="d" x="56" y="264">removal in progress</text>
  <rect class="b2" x="320" y="226" width="267" height="36" rx="6"/>
  <text class="d" x="600" y="250">about 2 months, incl. up to 1 month recovery</text>

  <text class="rl" x="56" y="320">Encrypted backups</text>
  <text class="d" x="56" y="344">disaster recovery</text>
  <rect class="b3" x="320" y="306" width="800" height="36" rx="6"/>
  <text class="d" x="336" y="330" style="fill:#3d3f45">up to 6 months</text>

  <line class="axis" x1="320" y1="372" x2="1120" y2="372"/>
  <line class="tick" x1="320" y1="372" x2="320" y2="382"/>
  <line class="tick" x1="587" y1="372" x2="587" y2="382"/>
  <line class="tick" x1="853" y1="372" x2="853" y2="382"/>
  <line class="tick" x1="1120" y1="372" x2="1120" y2="382"/>
  <text class="tl" x="320" y="404" text-anchor="middle">Deleted for good</text>
  <text class="tl" x="587" y="404" text-anchor="middle">2 months</text>
  <text class="tl" x="853" y="404" text-anchor="middle">4 months</text>
  <text class="tl" x="1120" y="404" text-anchor="middle">6 months</text>
</svg>
