<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="ten-title ten-desc">
  <title id="ten-title">The three moments a tenancy produces evidence</title>
  <desc id="ten-desc">A tenancy runs from the keys to the deposit. On day one, one hour of photographs records every room from the doorway, every existing mark, the inside of the oven, the meters with serial and reading in frame, and the check-in report amended in writing. In the middle, ten seconds at a time, every repair reported in writing, every call confirmed by email, every visit dated and every reply or silence recorded — this is the part most tenants keep nothing of. On the last day, another hour repeats the same frames as day one, after cleaning, with final meter readings and the date the keys went back.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 19px; font-weight: 600; fill: #0a0a0b; }
    .hw   { font-size: 19px; font-weight: 600; fill: #b3392c; }
    .item { font-size: 17px; fill: #3d3f45; }
    .lbl  { font-size: 14px; font-weight: 600; fill: #71757e; letter-spacing: .05em; }
    .lblw { font-size: 14px; font-weight: 600; fill: #b3392c; letter-spacing: .05em; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .cardw{ fill: #ffffff; stroke: #b3392c; stroke-width: 2; }
    .foot { font-size: 19px; fill: #3d3f45; }
    .tick { font-size: 15px; fill: #71757e; }
  </style>

  <line x1="40" y1="52" x2="1148" y2="52" stroke="#c9cdd4" stroke-width="2"/>
  <path d="M1148 46 L1162 52 L1148 58 Z" fill="#c9cdd4"/>
  <text class="tick" x="40"  y="36">the keys</text>
  <text class="tick" x="1148" y="36" text-anchor="end">the deposit</text>
  <circle cx="205" cy="52" r="6" fill="#0e7cc4"/>
  <circle cx="599" cy="52" r="6" fill="#b3392c"/>
  <circle cx="994" cy="52" r="6" fill="#0e7cc4"/>

  <rect class="card" x="24" y="84" width="362" height="284" rx="12"/>
  <rect x="24" y="84" width="362" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl"  x="52" y="122">DAY ONE &#8212; ONE HOUR</text>
  <text class="h"    x="52" y="152">Nothing here is yet your fault</text>
  <line x1="52" y1="172" x2="358" y2="172" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="52" y="206">Every room, wide, from the door</text>
  <text class="item" x="52" y="238">Every existing mark, close up</text>
  <text class="item" x="52" y="270">The oven, inside</text>
  <text class="item" x="52" y="302">Meters: serial + reading in frame</text>
  <text class="item" x="52" y="334">The report, amended in writing</text>

  <rect class="cardw" x="418" y="84" width="362" height="284" rx="12"/>
  <rect x="418" y="84" width="362" height="7" rx="3.5" fill="#b3392c"/>
  <text class="lblw" x="446" y="122">THE MIDDLE &#8212; TEN SECONDS EACH</text>
  <text class="hw"   x="446" y="152">The part nobody keeps</text>
  <line x1="446" y1="172" x2="752" y2="172" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="446" y="206">Every repair reported, in writing</text>
  <text class="item" x="446" y="238">Every call confirmed by email</text>
  <text class="item" x="446" y="270">Every visit, dated</text>
  <text class="item" x="446" y="302">Every reply &#8212; and every silence</text>
  <text class="item" x="446" y="334">Never rewritten, only appended</text>

  <rect class="card" x="812" y="84" width="364" height="284" rx="12"/>
  <rect x="812" y="84" width="364" height="7" rx="3.5" fill="#0e7cc4"/>
  <text class="lbl"  x="840" y="122">LAST DAY &#8212; ONE HOUR</text>
  <text class="h"    x="840" y="152">The mirror of day one</text>
  <line x1="840" y1="172" x2="1148" y2="172" stroke="#e6e6e9" stroke-width="2"/>
  <text class="item" x="840" y="206">The same frames as day one</text>
  <text class="item" x="840" y="238">After the cleaning, not before</text>
  <text class="item" x="840" y="270">Final meter readings</text>
  <text class="item" x="840" y="302">The date the keys went back</text>
  <text class="item" x="840" y="334">Read the check-in report again</text>

  <line x1="24" y1="400" x2="1176" y2="400" stroke="#e6e6e9" stroke-width="2"/>
  <text class="foot" x="24" y="436">Two of these are an hour each and everyone manages them. The dispute is almost always decided by the middle one.</text>
</svg>
