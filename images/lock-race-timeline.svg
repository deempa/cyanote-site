<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="lr-title lr-desc">
  <title id="lr-title">The 500ms debounce window that outlived the lock</title>
  <desc id="lr-desc">A keystroke schedules a database write 500 milliseconds later, carrying a decision made at schedule time that the note is unlocked. Locking the note completes in about 138 milliseconds. At 500 milliseconds the stale write runs and puts the plaintext back on disk beside the encrypted blob, where the search trigger then indexes it. The fix is to cancel the pending write when locking, and to re-read the lock state inside the write rather than trusting the flag captured earlier.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 23px; font-weight: 600; fill: #0a0a0b; }
    .item { font-size: 19px; fill: #3d3f45; }
    .gone { font-size: 19px; fill: #a3a7af; }
    .note { font-size: 18px; fill: #71757e; }
    .tick { font-size: 17px; font-weight: 600; fill: #0e7cc4; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .bad  { fill: #efeff1; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <rect class="card" x="24" y="24" width="1152" height="240" rx="12"/>
  <rect x="24" y="24" width="1152" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="54" y="80">One keystroke, one lock, one stale write</text>

  <line x1="80" y1="150" x2="1120" y2="150" stroke="#e6e6e9" stroke-width="4"/>

  <circle cx="80" cy="150" r="9" fill="#0e7cc4"/>
  <text class="tick" x="80" y="128" text-anchor="middle">0ms</text>
  <text class="item" x="80" y="188" text-anchor="middle">You type</text>
  <text class="note" x="80" y="212" text-anchor="middle">Write scheduled</text>
  <text class="note" x="80" y="234" text-anchor="middle">for +500ms</text>

  <circle cx="367" cy="150" r="9" fill="#0e7cc4"/>
  <text class="tick" x="367" y="128" text-anchor="middle">138ms</text>
  <text class="item" x="367" y="188" text-anchor="middle">Lock completes</text>
  <text class="note" x="367" y="212" text-anchor="middle">is_locked = 1, blob written,</text>
  <text class="note" x="367" y="234" text-anchor="middle">gate shown in the app</text>

  <circle cx="1120" cy="150" r="9" fill="#b8bcc4"/>
  <text class="tick" x="1090" y="128" text-anchor="middle">500ms</text>
  <text class="item" x="1000" y="188" text-anchor="middle">The stale write runs</text>
  <text class="note" x="1000" y="212" text-anchor="middle">carrying a decision made at 0ms:</text>
  <text class="note" x="1000" y="234" text-anchor="middle">&#8220;this note is unlocked, write it in the clear&#8221;</text>

  <rect class="bad" x="24" y="286" width="560" height="130" rx="12"/>
  <text class="h" x="54" y="330">The row it left</text>
  <text class="item" x="54" y="366">is_locked = 1 &#183; a valid encrypted blob</text>
  <text class="item" x="54" y="396">&#8212; and the plaintext beside it, indexed for search</text>

  <rect class="card" x="614" y="286" width="562" height="130" rx="12"/>
  <rect x="614" y="286" width="562" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="644" y="336">The fix</text>
  <text class="item" x="644" y="372">Locking cancels the pending write &#8212; cancel, not flush</text>
  <text class="item" x="644" y="400">and the write re-reads the lock state when it runs</text>

  <text class="foot" x="24" y="452">Every user-facing signal said the note was protected. Only the row on disk disagreed.</text>
</svg>
