<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">What each AI feature in a notes app actually transmits</title>
  <desc id="ai-desc">Summarising sends one note and rewriting sends a paragraph — both are transactions you initiate. Semantic search sends every note at least once, ask-your-notes sends whichever fragments the system judges relevant on every question, and automatic tagging reads everything on a schedule. The last three are standing arrangements rather than single decisions.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h    { font-size: 22px; font-weight: 600; fill: #0a0a0b; }
    .cap  { font-size: 19px; font-weight: 600; fill: #71757e; }
    .item { font-size: 19px; fill: #3d3f45; }
    .note { font-size: 18px; fill: #71757e; }
    .card { fill: #ffffff; stroke: #e6e6e9; stroke-width: 2; }
    .foot { font-size: 21px; fill: #3d3f45; }
  </style>

  <!-- transactions -->
  <rect class="card" x="24" y="30" width="560" height="340" rx="12"/>
  <rect x="24" y="30" width="560" height="8" rx="4" fill="#0e7cc4"/>
  <text class="h" x="54" y="86">A transaction you start</text>
  <text class="note" x="54" y="116">You press a button. You know what went.</text>
  <line x1="54" y1="146" x2="554" y2="146" stroke="#e6e6e9" stroke-width="2"/>

  <text class="cap" x="54" y="188">Summarise this note</text>
  <text class="item" x="54" y="218">Sends that one note.</text>

  <text class="cap" x="54" y="272">Rewrite this paragraph</text>
  <text class="item" x="54" y="302">Sends the surrounding text.</text>

  <text class="note" x="54" y="350">Bounded, and easy to reason about.</text>

  <!-- standing arrangements -->
  <rect class="card" x="614" y="30" width="560" height="340" rx="12"/>
  <rect x="614" y="30" width="560" height="8" rx="4" fill="#b8bcc4"/>
  <text class="h" x="644" y="86">A standing arrangement</text>
  <text class="note" x="644" y="116">Runs whether or not you asked today.</text>
  <line x1="644" y1="146" x2="1144" y2="146" stroke="#e6e6e9" stroke-width="2"/>

  <text class="cap" x="644" y="184">Semantic search</text>
  <text class="item" x="644" y="212">Sends every note, at least once.</text>

  <text class="cap" x="644" y="258">Ask your notes anything</text>
  <text class="item" x="644" y="286">Sends fragments, on every question,</text>
  <text class="item" x="644" y="312">converging on most of the collection.</text>

  <text class="cap" x="644" y="352">Auto-tagging</text>
  <text class="item" x="880" y="352">Reads all of it, on a schedule.</text>

  <text class="foot" x="24" y="424">Local models can do the first column well and the second column less well. There is no third option.</text>
</svg>
