name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Majors, not SHAs: this workflow is regenerated by deploy.sh on every
      # deploy, so a pin would go stale silently and the tree it publishes is
      # our own dist/. Bumped 16 Aug 2026 off the Node 20 deprecation warning —
      # the older majors still ran, on a forced Node 24.
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .          # .git and .github are excluded by the action
      - id: deployment
        uses: actions/deploy-pages@v5
